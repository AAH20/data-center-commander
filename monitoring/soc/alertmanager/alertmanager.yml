global:
  smtp_smarthost: ${SMTP_HOST:-localhost:587}
  smtp_from: ${SMTP_FROM:-soc-alerts@datacenter.local}
  smtp_auth_username: ${SMTP_USER:-}
  smtp_auth_password: ${SMTP_PASS:-}
  slack_api_url: ${SLACK_WEBHOOK_URL:-}
  pagerduty_url: ${PAGERDUTY_URL:-https://events.pagerduty.com/v2/enqueue}

route:
  receiver: default-receiver
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Critical security alerts → immediate escalation
    - matchers:
        - severity = "critical"
        - team = "security"
      receiver: soc-critical-security
      group_wait: 10s
      repeat_interval: 30m
      continue: true

    # Critical platform alerts
    - matchers:
        - severity = "critical"
        - team = "platform"
      receiver: soc-critical-platform
      group_wait: 15s
      repeat_interval: 1h
      continue: true

    # Warning alerts
    - matchers:
        - severity = "warning"
      receiver: soc-warning
      group_wait: 30s
      repeat_interval: 2h

    # Autoscaling-specific
    - matchers:
        - alertname =~ "HPA.*|ClusterAutoscaler.*|ScaleDown.*|NodeGroup.*"
      receiver: autoscaling-team
      group_wait: 30s
      repeat_interval: 1h

    # Container health
    - matchers:
        - alertname =~ "Container.*|Pod.*"
      receiver: container-team
      group_wait: 30s
      repeat_interval: 1h

receivers:
  - name: default-receiver
    webhook_configs:
      - url: ${WEBHOOK_URL:-http://localhost:5001/}
        send_resolved: true

  - name: soc-critical-security
    webhook_configs:
      - url: ${SECURITY_WEBHOOK_URL:-http://localhost:5001/security}
        send_resolved: true
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL:-}
        channel: "#soc-critical"
        title: "🚨 SOC CRITICAL: {{ .GroupLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
        send_resolved: true
    pagerduty_configs:
      - routing_key: ${PAGERDUTY_KEY:-}
        severity: critical
        description: "{{ .GroupLabels.alertname }}"

  - name: soc-critical-platform
    webhook_configs:
      - url: ${CRITICAL_WEBHOOK_URL:-http://localhost:5001/critical}
        send_resolved: true
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL:-}
        channel: "#platform-critical"
        title: "🔥 PLATFORM CRITICAL: {{ .GroupLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
        send_resolved: true
    pagerduty_configs:
      - routing_key: ${PAGERDUTY_KEY:-}
        severity: critical
        description: "{{ .GroupLabels.alertname }}"

  - name: soc-warning
    webhook_configs:
      - url: ${WEBHOOK_URL:-http://localhost:5001/}
        send_resolved: true
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL:-}
        channel: "#soc-warnings"
        title: "⚠️ SOC WARNING: {{ .GroupLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
        send_resolved: true

  - name: autoscaling-team
    webhook_configs:
      - url: ${WEBHOOK_URL:-http://localhost:5001/}
        send_resolved: true
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL:-}
        channel: "#autoscaling-alerts"
        title: "📈 AUTOSCALING: {{ .GroupLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
        send_resolved: true

  - name: container-team
    webhook_configs:
      - url: ${WEBHOOK_URL:-http://localhost:5001/}
        send_resolved: true
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL:-}
        channel: "#container-alerts"
        title: "🐳 CONTAINER: {{ .GroupLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
        send_resolved: true

inhibit_rules:
  # Critical inhibits warning for same alert/instance
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, instance]

  # Node down inhibits pod alerts on that node
  - source_match:
      alertname: KubeletDown
    target_match_re:
      alertname: "Pod.*|Container.*"
    equal: [instance]
