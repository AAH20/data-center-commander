global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: data-center-commander
    environment: production
    soc: enabled

rule_files:
  - "soc_alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Node exporter (host metrics)
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  # kube-state-metrics (HPA, PDB, deployments, pods, etc.)
  - job_name: kube-state-metrics
    static_configs:
      - targets:
          - kube-state-metrics:8080
    metrics_path: /metrics

  # cAdvisor (container metrics)
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
    metrics_path: /metrics

  # Kubelet (pod/container stats)
  - job_name: kubelet
    scheme: https
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics

  # Kubernetes API server
  - job_name: kubernetes-apiserver
    scheme: https
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: endpoints
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https

  # Kubernetes pods (annotated)
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod

  # Falco exporter (runtime security)
  - job_name: falco-exporter
    static_configs:
      - targets:
          - falco-exporter:9371
    metrics_path: /metrics
    scrape_interval: 30s

  # Cluster autoscaler metrics
  - job_name: cluster-autoscaler
    static_configs:
      - targets:
          - cluster-autoscaler:8085
    metrics_path: /metrics

  # Grafana self-monitoring
  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000
    metrics_path: /metrics
