# Alert rules for the DCC API.
#
# Every series referenced below is contract-checked by
# tests/unit/test_alert_rule_contract.py: a rule may only reference a metric this
# repository actually emits (the API's /metrics exposition, or an exporter under
# monitoring/) or a series listed in that test's external-metric allowlist.
#
# The reason is not stylistic. `expr: some_metric > 0` where nothing publishes
# `some_metric` is a rule that can never fire: the dashboard stays green and the
# pager stays silent, which is indistinguishable from a healthy system. Rules that
# cannot currently be backed by a series are kept in this file, commented out and
# marked INACTIVE with the reason, so the gap is visible instead of deleted.
groups:
  - name: dcc-api
    rules:
      - alert: DCCAPIDown
        expr: up{job="dcc-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "DCC API is down"
          description: "DCC API has been unreachable for more than 1 minute."

      # Re-enabled: the API now emits api_database_errors_total{operation}.
      #
      # Where it is incremented (src/dcc/api_async.py, _record_db_error):
      #   * operation="query"           -- a driver exception that escaped a handler
      #                                    and reached the metrics middleware on its
      #                                    way to the framework's error boundary;
      #   * operation="readiness_probe" -- a failed /readyz database probe, including
      #                                    the 503 get_pool() raises when the pool
      #                                    cannot be built or opened.
      # The family is registered at import, so it is present in /metrics with zero
      # samples on a healthy process rather than appearing only after the first
      # failure -- a family that does not exist cannot be alerted on.
      #
      # DECIDED (product): a request-path counter, not the exporter's readiness gauge.
      # Retargeting this at dcc_database_ready would duplicate DCCDatabaseUnhealthy in
      # monitoring/prometheus/alerts.yml, and up/down is not the error rate this rule
      # claims to report. rate() over a counter that only moves on a real failure says
      # "database faults are happening now", which is what the summary promises.
      - alert: DCCDatabaseUnavailable
        expr: sum(rate(api_database_errors_total[5m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "DCC database errors detected"
          description: "Database operations in the request path or the readiness probe have been failing for more than 2 minutes."

      # Was `sum(rate(dcc_api_requests_total{status=~"5.."}[5m])) / sum(rate(...))`.
      # Two things were wrong with it:
      #   1. the app publishes api_requests_total, not dcc_api_requests_total
      #      (src/dcc/api_async.py, metrics_middleware), so the whole expression
      #      matched no series;
      #   2. api_requests_total carries only a `route` label -- there is no
      #      `status` label to filter 5xx on. Server errors are counted separately
      #      in api_errors_total{type,route}, where _classify_status() maps
      #      HTTP >= 500 to type="internal" and 504 to type="timeout".
      # The ratio is therefore server errors / all requests, both counters, both
      # rate()-d over the same window.
      - alert: DCCHighErrorRate
        expr: |
          sum(rate(api_errors_total{type=~"internal|timeout"}[5m]))
          / sum(rate(api_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DCC API high error rate"
          description: "5xx error rate exceeds 5% over the last 5 minutes."

      # Re-enabled: the latency histogram now exists under a stable name.
      #
      # metrics_middleware calls record_latency("api_request_duration_seconds",
      # elapsed_seconds, labels={"route": label}) -- name, then seconds, then the route
      # template as a LABEL. /metrics therefore carries
      # api_request_duration_seconds_bucket{le, route}. The default buckets contain an
      # exact 0.5 boundary and run to 60s, so a p95 above 500ms is interpolated between
      # real bucket bounds instead of being clamped by the top bucket.
      #
      # There is NO `status` label on this family: it is one histogram over every
      # response, so the expression groups by (le, route) only. Server-error share is
      # DCCHighErrorRate's job (api_errors_total{type, route}), not this rule's.
      #
      # DECIDED (product): p95 per route above 500ms, 5m window, must hold 5m. Per
      # route rather than aggregated, because a single slow endpoint is invisible in a
      # service-wide p95 of a few dozen routes.
      - alert: DCCHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(api_request_duration_seconds_bucket[5m])) by (le, route)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DCC API high latency"
          description: "p95 latency exceeds 500ms for at least one route over 5 minutes."
