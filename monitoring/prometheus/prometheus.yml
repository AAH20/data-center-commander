global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'dcc-monitoring'

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "dcc-api"
    static_configs:
      - targets:
          - "host.docker.internal:8790"
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: "dcc-exporter"
    static_configs:
      - targets:
          - "dcc-exporter:8000"
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "grafana"
    static_configs:
      - targets:
          - "grafana:3000"
