groups:
  - name: dcc-alerts
    rules:
      - alert: DCCAPIUnhealthy
        expr: dcc_api_healthy == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "DCC API is unhealthy"
          description: "The Data Center Commander API has been unhealthy for more than 1 minute."

      - alert: DCCDatabaseUnhealthy
        expr: dcc_database_ready == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "DCC database is not ready"
          description: "The DCC database readiness check has been failing for more than 1 minute."

      - alert: DCCNoRecentTelemetry
        # The exporter signals "age unknown" with -1 (overview fetch failed, or the
        # payload carried no latest_telemetry_ingested_at). `> 3600` alone is silent
        # in exactly the case where freshness cannot be proven, so the negative
        # sentinel is alerted on too: unknown staleness is not freshness.
        expr: dcc_latest_telemetry_age_seconds > 3600 or dcc_latest_telemetry_age_seconds < 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No recent telemetry ingested"
          description: >-
            No telemetry has been ingested in the last hour, or telemetry age could
            not be determined (the exporter reports -1 when it cannot read
            latest_telemetry_ingested_at).

      - alert: DCCExporterDown
        expr: up{job="dcc-exporter"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "DCC Prometheus exporter is down"
          description: "The DCC exporter has been unreachable for more than 2 minutes."
