global:
  smtp_smarthost: ${SMTP_HOST:-localhost:587}
  smtp_from: ${SMTP_FROM:-alerts@datacenter.local}
  smtp_auth_username: ${SMTP_USER:-}
  smtp_auth_password: ${SMTP_PASS:-}
  slack_api_url: ${SLACK_WEBHOOK_URL:-}
  pagerduty_url: ${PAGERDUTY_URL:-https://events.pagerduty.com/v2/enqueue}

route:
  receiver: default-receiver
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: critical-receiver
      group_wait: 10s
      repeat_interval: 1h
      continue: true
    - matchers:
        - severity = "warning"
      receiver: warning-receiver
      group_wait: 30s
      repeat_interval: 2h
    - matchers:
        - team = "security"
      receiver: security-receiver
      group_wait: 15s
      repeat_interval: 1h

receivers:
  - name: default-receiver
    webhook_configs:
      - url: ${WEBHOOK_URL:-http://localhost:5001/}
        send_resolved: true

  - name: critical-receiver
    webhook_configs:
      - url: ${CRITICAL_WEBHOOK_URL:-http://localhost:5001/critical}
        send_resolved: true
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL:-}
        channel: "#datacenter-alerts"
        title: "🚨 CRITICAL: {{ .GroupLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
        send_resolved: true
    pagerduty_configs:
      - routing_key: ${PAGERDUTY_KEY:-}
        severity: critical
        description: "{{ .GroupLabels.alertname }}"

  - name: warning-receiver
    webhook_configs:
      - url: ${WEBHOOK_URL:-http://localhost:5001/}
        send_resolved: true
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL:-}
        channel: "#datacenter-warnings"
        title: "⚠️ WARNING: {{ .GroupLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
        send_resolved: true

  - name: security-receiver
    webhook_configs:
      - url: ${SECURITY_WEBHOOK_URL:-http://localhost:5001/security}
        send_resolved: true
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL:-}
        channel: "#security-alerts"
        title: "🔒 SECURITY: {{ .GroupLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, instance]
