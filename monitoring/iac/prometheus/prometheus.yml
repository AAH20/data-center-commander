global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: data-center-commander
    environment: production

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Node exporter (host metrics)
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  # IaC custom exporter (Checkov, Terraform plan metrics)
  - job_name: iac-exporter
    static_configs:
      - targets:
          - iac-exporter:9091
    metrics_path: /metrics
    scrape_interval: 5m

  # Grafana self-monitoring
  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000
    metrics_path: /metrics
