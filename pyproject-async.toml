# Data Center Commander — Async Development Server
# Usage: uvicorn dcc.api_async:app --host 127.0.0.1 --port 8790 --reload

[project]
name = "data-center-commander"
version = "2.0.0"
description = "Read-only, energy-to-compute data-center operations command view"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "psycopg[binary,pool]>=3.2.0,<4.0.0",
    "redis>=5.0.0,<6.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
