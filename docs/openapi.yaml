openapi: 3.1.0
info:
  title: Data Center Commander API
  version: 0.1.0
  description: |
    Data Center Commander HTTP API.

    **Which service this describes (measured 2026-10-26).** This document covers
    the legacy standard-library handler in `src/dcc/api.py`, which serves the
    `/v1/*` paths below. That handler is unmounted: `scripts/run-local.py` starts
    `dcc.api_async:app` (FastAPI, `/v2/*`), which is also the `Dockerfile`
    entrypoint, and the legacy handler is reachable only with `--legacy`. The
    served application publishes its own contract at `/openapi.json` (and `/docs`).

    Consequence, measured by comparing this file with `dcc.api_async.app.routes`:
    14 of the paths documented here (`/v1/overview`, `/v1/topology`,
    `/v1/facilities`, `/v1/assets`, `/v1/workflows`, `/v1/connectors`,
    `/v1/capacity`, `/v1/evidence`, `/v1/costs`, `/v1/analytics`,
    `/v1/placement/scenarios`, both `/v1/pricing/*`, and `/assets/{filename}`) are
    not served by the running application, and all 29 `/v2` paths it does serve
    are absent from this file. Do not treat this document as the served contract
    until it is regenerated from `app.openapi()`.

    `/readyz` is the exception: it is the same route on both handlers and the
    probe semantics below are the served ones (`dcc.api_async`), because that is
    the process listening on the documented server URL.

    All endpoints are unauthenticated and must remain loopback-only.
    Tenant isolation is enforced via PostgreSQL Row-Level Security.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
  contact:
    name: Data Center Commander
    url: https://github.com/AAH20/data-center-commander
servers:
  - url: http://127.0.0.1:8790
    description: Local development server (loopback only)
tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Overview
    description: Tenant-level summary
  - name: Topology
    description: Asset relationship graph
  - name: Facilities
    description: Data center facilities
  - name: Assets
    description: IT and facility assets
  - name: Workflows
    description: Operational workflows and work orders
  - name: Connectors
    description: Integration connector registry
  - name: Capacity
    description: Capacity snapshots and forecasts
  - name: Evidence
    description: Append-only evidence events
  - name: Costs
    description: Cost estimates, prices, and actuals
  - name: Analytics
    description: KPI series, quality, and telemetry
  - name: Placement
    description: Placement comparison snapshots
  - name: Pricing
    description: Cloud provider retail price lookups
  - name: UI
    description: Static UI assets
paths:
  /:
    get:
      tags: [UI]
      summary: Serve the command-center UI
      description: Returns the main index.html for the browser-based command center.
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Returns service liveness. Does not check database connectivity.
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: data-center-commander
                  mode:
                    type: string
                    example: read_only
                  execution_permitted:
                    type: boolean
                    example: false
  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      description: |
        Checks database connectivity, the required schema tables, and forced
        tenant Row-Level Security.

        503 means the instance cannot serve: either the schema is incomplete or
        the database is unreachable. `tenant_rls` does NOT gate readiness — an
        unprotected table is a data-exposure finding that needs a migration, and
        failing readiness for it would take the instance out of rotation (an
        outage taken to fix a report). A response can therefore be
        `200 ready:true` with `tenant_rls: missing`.

        Each failure mode reports only the keys it managed to measure, so
        `checks.database` is absent from the schema-incomplete body and
        `checks.schema` / `checks.tenant_rls` are absent from the unreachable body.

        Measured from `dcc.api_async` (the served FastAPI app) on 2026-10-26:
        `{"ready": true, "checks": {"database": "ok", "schema": "ok",
        "tenant_rls": "ok", "tenant_rls_tables": 52,
        "tenant_rls_unprotected": 0}}`.
      responses:
        '200':
          description: All readiness checks passed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
                    example: true
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                        enum: [ok]
                      schema:
                        type: string
                        enum: [ok]
                      tenant_rls:
                        type: string
                        enum: [ok, missing, not_assessed]
                        description: |
                          Whether every tenant-scoped table (one carrying a
                          `tenant_id` column) has RLS both ENABLED and FORCED.
                          `ok` — all are protected. `missing` — at least one is
                          not; the counts below say how many. `not_assessed` —
                          the catalog could not be read, or the schema held no
                          tenant-scoped table to assess (a pass earned by finding
                          nothing is not reported as a pass).
                      tenant_rls_tables:
                        type: integer
                        description: Tenant-scoped tables the assessment saw. Present when `tenant_rls` is `ok` or `missing`.
                        example: 52
                      tenant_rls_unprotected:
                        type: integer
                        description: Tenant-scoped tables lacking enabled-and-forced RLS. `0` when `tenant_rls` is `ok`.
                        example: 0
        '503':
          description: |
            The instance cannot serve. Body is one of two measured shapes:
            `{"ready": false, "checks": {"schema": "incomplete", "tenant_rls":
            "not_assessed"}}` or `{"ready": false, "checks": {"database":
            "unreachable"}}`. The error detail is logged, never returned: a
            driver error routinely embeds the DSN.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
                    example: false
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                        enum: [unreachable]
                        description: Present only when the pool could not be built, or the database did not answer.
                      schema:
                        type: string
                        enum: [incomplete]
                        description: Present only when `dcc.tenants` or `dcc.assets` is missing.
                      tenant_rls:
                        type: string
                        enum: [not_assessed]
                        description: 'Reported alongside `schema: incomplete`; RLS is never assessed when the schema is not there.'
  /v1/overview:
    get:
      tags: [Overview]
      summary: Tenant overview
      description: |
        Returns a tenant-level summary including active facility count,
        latest KPI observations, open workflow count, and latest telemetry
        ingestion timestamp. Synthetic data is quarantined unless
        `demo=synthetic` is explicitly provided.
      parameters:
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/demoMode'
      responses:
        '200':
          description: Tenant overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                    format: uuid
                  facility_count:
                    type: integer
                    example: 3
                  kpis:
                    type: array
                    items:
                      $ref: '#/components/schemas/KpiObservation'
                  open_workflows:
                    type: integer
                    example: 5
                  latest_telemetry_ingested_at:
                    type: string
                    format: date-time
                    nullable: true
                  source_status:
                    type: string
                    enum: [synthetic_demo, observed, no_telemetry]
                  synthetic:
                    type: boolean
                  synthetic_demo_mode:
                    type: boolean
                  read_only:
                    type: boolean
                    example: true
                  execution_permitted:
                    type: boolean
                    example: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /v1/topology:
    get:
      tags: [Topology]
      summary: Asset topology graph
      description: |
        Returns nodes (assets) and edges (relationships) for the tenant's
        asset topology graph. Limited to 500 nodes and 1000 edges.
      parameters:
        - $ref: '#/components/parameters/tenantId'
      responses:
        '200':
          description: Topology graph
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                    format: uuid
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/TopologyNode'
                  edges:
                    type: array
                    items:
                      $ref: '#/components/schemas/TopologyEdge'
                  read_only:
                    type: boolean
                    example: true
                  source:
                    type: string
                    example: postgresql_asset_relationships
                  execution_permitted:
                    type: boolean
                    example: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /v1/facilities:
    get:
      tags: [Facilities]
      summary: List facilities
      description: Returns all facilities for the tenant, ordered by site and name. Limited to 500 rows.
      parameters:
        - $ref: '#/components/parameters/tenantId'
      responses:
        '200':
          description: Facility list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                    format: uuid
                  facilities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Facility'
                  read_only:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /v1/assets:
    get:
      tags: [Assets]
      summary: List assets
      description: Returns all assets for the tenant, ordered by lifecycle state and name. Limited to 1000 rows.
      parameters:
        - $ref: '#/components/parameters/tenantId'
      responses:
        '200':
          description: Asset list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                    format: uuid
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
                  read_only:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /v1/workflows:
    get:
      tags: [Workflows]
      summary: List operational workflows
      description: Returns operational workflows ordered by status, priority, and due date. Limited to 500 rows.
      parameters:
        - $ref: '#/components/parameters/tenantId'
      responses:
        '200':
          description: Workflow list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                    format: uuid
                  workflows:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workflow'
                  read_only:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /v1/connectors:
    get:
      tags: [Connectors]
      summary: List connectors
      description: Returns all integration connectors for the tenant. Limited to 500 rows.
      parameters:
        - $ref: '#/components/parameters/tenantId'
      responses:
        '200':
          description: Connector list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                    format: uuid
                  connectors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Connector'
                  read_only:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /v1/capacity:
    get:
      tags: [Capacity]
      summary: List capacity snapshots
      description: |
        Returns the latest capacity snapshot per facility, dimension, and
        scenario. Limited to 1000 rows.
      parameters:
        - $ref: '#/components/parameters/tenantId'
      responses:
        '200':
          description: Capacity snapshot list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                    format: uuid
                  capacity:
                    type: array
                    items:
                      $ref: '#/components/schemas/CapacitySnapshot'
                  read_only:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /v1/evidence:
    get:
      tags: [Evidence]
      summary: List evidence events
      description: Returns the most recent evidence events for the tenant (latest 100).
      parameters:
        - $ref: '#/components/parameters/tenantId'
      responses:
        '200':
          description: Evidence event list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                    format: uuid
                  evidence:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvidenceEvent'
                  read_only:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /v1/costs:
    get:
      tags: [Costs]
      summary: Cost intelligence
      description: |
        Returns cost estimates, price observations, and cost actuals for the
        tenant. Synthetic data is quarantined unless `demo=synthetic` is
        explicitly provided.
      parameters:
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/demoMode'
      responses:
        '200':
          description: Cost intelligence data
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                    format: uuid
                  estimates:
                    type: array
                    items:
                      $ref: '#/components/schemas/EstimateProject'
                  prices:
                    type: array
                    items:
                      $ref: '#/components/schemas/PriceObservation'
                  actuals:
                    type: array
                    items:
                      $ref: '#/components/schemas/CostActual'
                  read_only:
                    type: boolean
                    example: true
                  synthetic:
                    type: boolean
                  synthetic_demo_mode:
                    type: boolean
                  execution_permitted:
                    type: boolean
                    example: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /v1/analytics:
    get:
      tags: [Analytics]
      summary: Analytics and KPI data
      description: |
        Returns KPI time series, KPI quality summaries, telemetry quality
        breakdowns, and workflow health metrics for the specified window.
      parameters:
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/windowDays'
      responses:
        '200':
          description: Analytics data
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                    format: uuid
                  window_days:
                    type: integer
                    example: 30
                  kpi_series:
                    type: array
                    items:
                      $ref: '#/components/schemas/KpiSeriesPoint'
                  kpi_quality:
                    type: array
                    items:
                      $ref: '#/components/schemas/KpiQualitySummary'
                  telemetry_quality:
                    type: array
                    items:
                      $ref: '#/components/schemas/TelemetryQuality'
                  workflow_health:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowHealth'
                  model_policy:
                    type: object
                    properties:
                      trend_forecast_min_daily_points:
                        type: integer
                        example: 7
                      anomaly_min_daily_points:
                        type: integer
                        example: 14
                      maintenance_failure_labels_required:
                        type: boolean
                        example: true
                      note:
                        type: string
                  read_only:
                    type: boolean
                    example: true
                  execution_permitted:
                    type: boolean
                    example: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /v1/placement/scenarios:
    get:
      tags: [Placement]
      summary: List placement comparison snapshots
      description: |
        Returns draft placement comparison snapshots for the tenant, ordered
        by creation date descending. Limited to 100 rows. Snapshots are
        append-only and immutable.
      parameters:
        - $ref: '#/components/parameters/tenantId'
      responses:
        '200':
          description: Placement snapshot list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                    format: uuid
                  scenarios:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlacementSnapshot'
                  status:
                    type: string
                    example: draft_snapshots
                  execution_permitted:
                    type: boolean
                    example: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    post:
      tags: [Placement]
      summary: Create placement comparison snapshot
      description: |
        Creates a new draft placement comparison snapshot. The request must
        originate from the same origin (loopback). The payload is validated,
        canonically hashed with SHA-256, and stored as an immutable draft.
        Snapshots are browser-calculated and are not approved estimates.
      parameters:
        - $ref: '#/components/parameters/tenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlacementSnapshotInput'
      responses:
        '201':
          description: Snapshot created
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                    format: uuid
                  scenario:
                    $ref: '#/components/schemas/PlacementSnapshot'
                  status:
                    type: string
                    example: draft_snapshot
                  execution_permitted:
                    type: boolean
                    example: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Same-origin policy violation
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: same_origin_required
                  execution_permitted:
                    type: boolean
                    example: false
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /v1/pricing/azure-retail:
    get:
      tags: [Pricing]
      summary: Azure retail prices
      description: |
        Fetches a bounded page of Azure retail prices from the public Azure
        Retail Prices API. Returns up to 100 rows. Never follows provider
        next-page links. Prices are public retail list rates only.
      parameters:
        - $ref: '#/components/parameters/tenantId'
        - name: service_name
          in: query
          required: true
          description: Azure service name (e.g., "Virtual Machines")
          schema:
            type: string
            maxLength: 80
            pattern: '^[A-Za-z0-9 ()&._/-]+$'
            example: Virtual Machines
        - name: region
          in: query
          required: false
          description: Azure region name
          schema:
            type: string
            maxLength: 80
            pattern: '^[A-Za-z0-9._-]*$'
        - name: sku
          in: query
          required: false
          description: Azure SKU name
          schema:
            type: string
            maxLength: 80
            pattern: '^[A-Za-z0-9._-]*$'
        - name: currency
          in: query
          required: false
          description: ISO 4217 currency code
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
            default: USD
      responses:
        '200':
          description: Azure retail price results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzurePriceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          description: Azure price catalog unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  execution_permitted:
                    type: boolean
                    example: false
  /v1/pricing/google-cloud-retail:
    get:
      tags: [Pricing]
      summary: Google Cloud retail prices
      description: |
        Searches the Google Cloud Billing Catalog API for SKUs matching the
        query. Returns up to 100 rows. Requires GOOGLE_CLOUD_BILLING_API_KEY
        in the server environment. Prices are public catalog list rates.
      parameters:
        - $ref: '#/components/parameters/tenantId'
        - name: service_name
          in: query
          required: true
          description: Google Cloud service display name (e.g., "Compute Engine")
          schema:
            type: string
            maxLength: 80
            pattern: '^[A-Za-z0-9 &()._/-]+$'
            example: Compute Engine
        - name: region
          in: query
          required: true
          description: Google Cloud region (e.g., "us-central1")
          schema:
            type: string
            maxLength: 80
            pattern: '^[A-Za-z0-9._-]+$'
        - name: sku_query
          in: query
          required: true
          description: SKU description search string
          schema:
            type: string
            maxLength: 100
            pattern: '^[A-Za-z0-9 &()._/-]+$'
        - name: currency
          in: query
          required: false
          description: ISO 4217 currency code
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
            default: USD
      responses:
        '200':
          description: Google Cloud retail price results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleCloudPriceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          description: Google Cloud Billing catalog unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  execution_permitted:
                    type: boolean
                    example: false
        '503':
          description: Google Cloud Billing API key not configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  execution_permitted:
                    type: boolean
                    example: false
  /assets/{filename}:
    get:
      tags: [UI]
      summary: Serve UI JavaScript asset
      description: Serves a static JavaScript file from the UI directory.
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
            enum:
              - onboarding.js
              - topology.js
              - azure-prices.js
              - placement-comparison.js
              - placement-scenarios.js
              - quality-dashboard.js
      responses:
        '200':
          description: JavaScript file
          content:
            text/javascript:
              schema:
                type: string
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: asset_not_found
components:
  parameters:
    tenantId:
      name: tenant_id
      in: query
      required: true
      description: Tenant UUID for row-level security scoping
      schema:
        type: string
        format: uuid
    demoMode:
      name: demo
      in: query
      required: false
      description: Set to "synthetic" to include synthetic demo data in the response
      schema:
        type: string
        enum: [synthetic]
    windowDays:
      name: window_days
      in: query
      required: false
      description: Analysis window in days (1-90)
      schema:
        type: integer
        minimum: 1
        maximum: 90
        default: 30
  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              execution_permitted:
                type: boolean
                example: false
    DatabaseUnavailable:
      description: Database unavailable or schema missing
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                enum: [database_not_configured, database_unavailable_or_schema_missing]
              read_only:
                type: boolean
                example: true
              execution_permitted:
                type: boolean
                example: false
  schemas:
    KpiObservation:
      type: object
      properties:
        metric_key:
          type: string
        name:
          type: string
        unit:
          type: string
        value_numeric:
          type: number
          nullable: true
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        observed_at:
          type: string
          format: date-time
        coverage:
          type: number
        uncertainty:
          type: number
        quality_status:
          type: string
        reason_codes:
          type: array
          items:
            type: string
        provenance:
          type: object
    TopologyNode:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          example: asset
        label:
          type: string
        type:
          type: string
        state:
          type: string
        criticality:
          type: string
        external_id:
