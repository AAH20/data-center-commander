          example: placement-tco-comparison.v1
        payload:
          type: object
        payload_sha256:
          type: string
        created_at:
          type: string
          format: date-time
    PlacementSnapshotInput:
      type: object
      required: [name, payload]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        payload:
          type: object
          required: [schema_version, assumptions, sources, results]
          properties:
            schema_version:
              type: string
              enum: [placement-tco-comparison.v1]
            assumptions:
              type: object
              required: [currency, horizon_months]
              properties:
                currency:
                  type: string
                  pattern: '^[A-Za-z]{3}$'
                horizon_months:
                  type: integer
                  minimum: 1
                  maximum: 120
            sources:
              type: object
              required: [onprem, cloud]
              properties:
                onprem:
                  $ref: '#/components/schemas/PlacementSource'
                cloud:
                  $ref: '#/components/schemas/PlacementSource'
            results:
              type: object
              required: [onprem, cloud]
              properties:
                onprem:
                  type: object
                cloud:
                  type: object
