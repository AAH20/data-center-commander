---
# Container-level tracing: DaemonSet for node-level trace collection
# Deploys OTel agent on each node to capture container spans
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-container-agent
  namespace: data-center-commander
  labels:
    app: otel-container-agent
    app.kubernetes.io/component: container-tracing
    soc.criticality: high
spec:
  selector:
    matchLabels:
      app: otel-container-agent
  template:
    metadata:
      labels:
        app: otel-container-agent
        app.kubernetes.io/component: container-tracing
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: otel-agent
          image: otel/opentelemetry-collector-contrib:0.109.0
          args:
            - --config=/conf/otel-agent.yaml
          ports:
            - containerPort: 4317
              name: otlp-grpc
              hostPort: 4317
            - containerPort: 4318
              name: otlp-http
              hostPort: 4318
            - containerPort: 8888
              name: metrics
          volumeMounts:
            - name: config
              mountPath: /conf
            - name: containerd
              mountPath: /run/containerd/containerd.sock
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdocker
              mountPath: /var/lib/docker/containers
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            privileged: true
      volumes:
        - name: config
          configMap:
            name: otel-container-agent-config
        - name: containerd
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdocker
          hostPath:
            path: /var/lib/docker/containers
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-container-agent-config
  namespace: data-center-commander
data:
  otel-agent.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      filelog:
        include: [/var/log/containers/*.log]
        start_at: end
        operators:
          - type: json_parser
            timestamp:
              parse_from: attributes.time
              layout_type: gotime
              layout: "2006-01-02T15:04:05.999999999Z07:00"
          - type: severity_parser
            parse_from: attributes.level
            mapping:
              debug: debug
              info: info
              warn: warn
              error: error
              fatal: fatal
    processors:
      batch:
        timeout: 5s
        send_batch_size: 256
      resource:
        attributes:
          - key: k8s.node.name
            from_attribute: k8s.node.name
            action: upsert
          - key: container.id
            from_attribute: container.id
            action: upsert
          - key: container.image.name
            from_attribute: container.image.name
            action: upsert
          - key: soc.container.tracing
            value: "true"
            action: upsert
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.pod.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.uid
            - k8s.pod.start_time
          labels:
            - tag_name: app
              key: app
              from: pod
    exporters:
      otlp:
        endpoint: otel-collector:4317
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource, k8sattributes, batch]
          exporters: [otlp]
        logs:
          receivers: [filelog]
          processors: [resource, k8sattributes, batch]
          exporters: [otlp]
---
# NetworkPolicy: allow container agents to reach central collector
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-container-agent-netpol
  namespace: data-center-commander
spec:
  podSelector:
    matchLabels:
      app: otel-container-agent
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
