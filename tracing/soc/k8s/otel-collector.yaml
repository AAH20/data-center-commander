---
# OpenTelemetry Collector deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: data-center-commander
  labels:
    app: otel-collector
    app.kubernetes.io/component: tracing
    soc.criticality: high
spec:
  replicas: 2
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        app.kubernetes.io/component: tracing
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.109.0
          args:
            - --config=/conf/otel-collector.yaml
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8888
              name: metrics
            - containerPort: 13133
              name: health
            - containerPort: 14250
              name: jaeger-grpc
            - containerPort: 14268
              name: jaeger-thrift
            - containerPort: 9411
              name: zipkin
          volumeMounts:
            - name: config
              mountPath: /conf
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: data-center-commander
data:
  otel-collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14250
          thrift_http:
            endpoint: 0.0.0.0:14268
      zipkin:
        endpoint: 0.0.0.0:9411
    processors:
      batch:
        timeout: 5s
        send_batch_size: 512
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
      resource:
        attributes:
          - key: environment
            value: production
            action: upsert
          - key: cluster
            value: data-center-commander
            action: upsert
          - key: soc.tier
            value: critical
            action: upsert
      tail_sampling:
        decision_wait: 10s
        num_traces: 100000
        expected_new_traces_per_sec: 1000
        policies:
          - name: errors-policy
            type: status_code
            status_code:
              status_codes: [ERROR]
          - name: latency-policy
            type: latency
            latency:
              threshold_ms: 500
          - name: probabilistic-policy
            type: probabilistic
            probabilistic:
              sampling_percentage: 10
    exporters:
      jaeger:
        endpoint: jaeger-collector:14250
        tls:
          insecure: true
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
      logging:
        loglevel: info
      webhook/soc:
        endpoint: http://soc-processor:8080/v1/traces
        headers:
          X-SOC-Source: otel-collector
          X-SOC-Tier: critical
    service:
      pipelines:
        traces:
          receivers: [otlp, jaeger, zipkin]
          processors: [memory_limiter, resource, tail_sampling, batch]
          exporters: [jaeger, otlp/tempo, webhook/soc, logging]
      telemetry:
        logs:
          level: info
        metrics:
          address: 0.0.0.0:8888
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      pprof:
        endpoint: 0.0.0.0:1777
      zpages:
        endpoint: 0.0.0.0:55679
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: data-center-commander
  labels:
    app: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - port: 4317
      name: otlp-grpc
      targetPort: 4317
    - port: 4318
      name: otlp-http
      targetPort: 4318
    - port: 8888
      name: metrics
      targetPort: 8888
    - port: 14250
      name: jaeger-grpc
      targetPort: 14250
    - port: 14268
      name: jaeger-thrift
      targetPort: 14268
    - port: 9411
      name: zipkin
      targetPort: 9411
  type: ClusterIP
