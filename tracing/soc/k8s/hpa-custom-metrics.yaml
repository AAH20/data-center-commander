---
# AutoScaling based on custom metrics derived from traces
# Scales services based on request rate, error rate, and latency from OTel metrics
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: elasticsearch-trace-hpa
  namespace: data-center-commander
  labels:
    app: elasticsearch
    app.kubernetes.io/component: autoscaling
    soc.criticality: high
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: elasticsearch
  minReplicas: 1
  maxReplicas: 5
  metrics:
    # Scale on request rate from traces
    - type: Pods
      pods:
        metric:
          name: traces_span_count
          selector:
            matchLabels:
              span.kind: server
        target:
          type: AverageValue
          averageValue: "1000"
    # Scale on error rate from traces
    - type: Pods
      pods:
        metric:
          name: traces_span_errors
          selector:
            matchLabels:
              status.code: ERROR
        target:
          type: AverageValue
          averageValue: "50"
    # Scale on p99 latency from traces
    - type: Pods
      pods:
        metric:
          name: traces_latency_p99
          selector:
            matchLabels:
              span.kind: server
        target:
          type: AverageValue
          averageValue: 500m
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: logstash-trace-hpa
  namespace: data-center-commander
  labels:
    app: logstash
    app.kubernetes.io/component: autoscaling
    soc.criticality: high
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: logstash
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Pods
      pods:
        metric:
          name: traces_span_count
          selector:
            matchLabels:
              span.kind: server
        target:
          type: AverageValue
          averageValue: "2000"
    - type: Pods
      pods:
        metric:
          name: traces_span_errors
          selector:
            matchLabels:
              status.code: ERROR
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kibana-trace-hpa
  namespace: data-center-commander
  labels:
    app: kibana
    app.kubernetes.io/component: autoscaling
    soc.criticality: medium
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kibana
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Pods
      pods:
        metric:
          name: traces_span_count
          selector:
            matchLabels:
              span.kind: server
        target:
          type: AverageValue
          averageValue: "500"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
---
# KEDA ScaledObject for event-driven autoscaling based on trace volume
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: soc-processor-keda
  namespace: data-center-commander
  labels:
    app: soc-processor
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    name: soc-processor
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        metricName: traces_per_second
        threshold: "1000"
        query: |
          sum(rate(traces_span_count{span_kind="server"}[1m]))
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        metricName: error_rate
        threshold: "0.05"
        query: |
          sum(rate(traces_span_errors{status_code="ERROR"}[1m]))
          /
          sum(rate(traces_span_count[1m]))
