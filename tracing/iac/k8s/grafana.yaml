---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: tracing
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: data-center-commander
data:
  grafana.ini: |
    [auth.anonymous]
    enabled = true
    org_role = Admin

    [auth]
    disable_login_form = true

    [server]
    http_port = 3000

    [dashboards]
    default_home_dashboard_path = /var/lib/grafana/dashboards/tracing.json
  datasources.yml: |
    apiVersion: 1

    datasources:
      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger.tracing.svc.cluster.local:16686
        isDefault: true
        editable: true
        jsonData:
          httpMethod: POST
          nodeGraph:
            enabled: true

      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.tracing.svc.cluster.local:9090
        isDefault: false
        editable: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: tracing
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: data-center-commander
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: data-center-commander
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.3.0
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/tracing.json
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: config
          configMap:
            name: grafana-config
            items:
              - key: grafana.ini
                path: grafana.ini
        - name: datasources
          configMap:
            name: grafana-config
            items:
              - key: datasources.yml
                path: datasources.yml
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: tracing
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: data-center-commander
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: tracing
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: data-center-commander
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  type: ClusterIP
