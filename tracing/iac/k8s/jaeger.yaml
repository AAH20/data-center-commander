---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  namespace: tracing
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: data-center-commander
data:
  COLLECTOR_OTLP_ENABLED: "true"
  SPAN_STORAGE_TYPE: "memory"
  MEMORY_MAX_TRACES: "50000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: tracing
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: data-center-commander
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: data-center-commander
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "16686"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.53
          ports:
            - name: ui
              containerPort: 16686
              protocol: TCP
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: grpc
              containerPort: 14250
              protocol: TCP
            - name: http
              containerPort: 14268
              protocol: TCP
          envFrom:
            - configMapRef:
                name: jaeger-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: tracing
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: data-center-commander
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: ui
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
    - name: grpc
      port: 14250
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 14268
      targetPort: http
      protocol: TCP
  type: ClusterIP
