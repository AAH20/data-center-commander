apiVersion: v1
kind: Service
metadata:
  name: {{ include "dcc-lb.fullname" . }}
  labels:
    {{- include "dcc-lb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.ports.http.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.ports.https.port }}
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "dcc-lb.selectorLabels" . | nindent 4 }}
