# Data Center Commander — Nginx Load Balancer
# Reverse proxy / load balancer for the DCC API and UI.
#
# Backend: Python ThreadingHTTPServer on 127.0.0.1:8790 (loopback-only).
# This nginx layer adds TLS termination, rate limiting, and multi-instance
# load balancing in front of the loopback-only API.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Gzip ─────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # ── Rate Limiting ────────────────────────────────────────────────────
    # 10 req/s per IP with burst of 20 — generous for UI, tight enough to
    # prevent accidental abuse of the unauthenticated loopback API.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=health_limit:10m rate=1r/s;

    # ── Upstream: DCC API backends ───────────────────────────────────────
    # Add or remove servers here to scale horizontally.
    # All backends must be loopback-only instances of scripts/run-local.py.
    upstream dcc_api {
        least_conn;

        server 127.0.0.1:8790 weight=5 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8791 weight=5 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8792 weight=5 max_fails=3 fail_timeout=30s;

        keepalive 32;
    }

    # ── Upstream: Health check (dedicated, no rate limit) ───────────────
    upstream dcc_health {
        server 127.0.0.1:8790;
        server 127.0.0.1:8791;
        server 127.0.0.1:8792;
    }

    # ── Map: WebSocket upgrade (future-proofing) ─────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Server: HTTP → HTTPS redirect ───────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Allow health checks over HTTP for LB health probes
        location /healthz {
            proxy_pass http://dcc_health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /readyz {
            proxy_pass http://dcc_health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Server: HTTPS (primary) ─────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # ── TLS ──────────────────────────────────────────────────────────
        # Replace with real certs in production. For local testing,
        # generate self-signed: openssl req -x509 -nodes -days 365 \
        #   -newkey rsa:2048 -keyout /etc/nginx/certs/dcc.key \
        #   -out /etc/nginx/certs/dcc.crt
        ssl_certificate /etc/nginx/certs/dcc.crt;
        ssl_certificate_key /etc/nginx/certs/dcc.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Security headers ────────────────────────────────────────────
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ── Health endpoints (no rate limit) ────────────────────────────
        location /healthz {
            proxy_pass http://dcc_health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /readyz {
            proxy_pass http://dcc_health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # ── API endpoints (rate limited) ────────────────────────────────
        location /v1/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://dcc_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Timeouts — generous for analytics queries
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Buffer settings for large JSON responses
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 4 32k;
            proxy_busy_buffers_size 64k;
        }

        # ── Static UI assets ────────────────────────────────────────────
        location /assets/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://dcc_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache static assets aggressively
            proxy_cache_valid 200 1h;
            proxy_cache_valid 404 1m;
            expires 1h;
        }

        # ── Root / UI ───────────────────────────────────────────────────
        location / {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://dcc_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ── Deny access to hidden files ─────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
