# Replace the placeholder value with a base64-encoded connection string.
# Example:
#   echo -n 'postgresql://dcc:password@postgres.data-center-commander.svc:5432/data_center_commander' | base64
#
# For production, use an external secret manager (e.g. External Secrets Operator,
# AWS Secrets Manager, HashiCorp Vault) instead of committing this file.
apiVersion: v1
kind: Secret
metadata:
  name: dcc-secrets
  namespace: data-center-commander
  labels:
    app.kubernetes.io/name: data-center-commander
    app.kubernetes.io/part-of: dcc
type: Opaque
stringData:
  # Base64-encode the full DCC_DATABASE_URL value.
  # This is a placeholder — replace before applying.
  DCC_DATABASE_URL: "postgresql://dcc:CHANGE_ME@postgres.data-center-commander.svc.cluster.local:5432/data_center_commander"
