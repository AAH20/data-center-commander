apiVersion: apps/v1
kind: Deployment
metadata:
  name: dcc-api
  namespace: data-center-commander
  labels:
    app.kubernetes.io/name: data-center-commander
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: dcc
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: data-center-commander
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-center-commander
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: dcc
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: dcc-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: data-center-commander:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8790
              protocol: TCP
          envFrom:
            - configMapRef:
                name: dcc-config
          env:
            - name: DCC_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dcc-secrets
                  key: DCC_DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: data-center-commander
              app.kubernetes.io/component: api
