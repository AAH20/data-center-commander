---
# Wazuh Manager Service
apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager
  namespace: soc
  labels:
    app: wazuh-manager
spec:
  type: ClusterIP
  ports:
    - port: 1514
      targetPort: 1514
      protocol: TCP
      name: agents
    - port: 1515
      targetPort: 1515
      protocol: TCP
      name: registration
    - port: 55000
      targetPort: 55000
      protocol: TCP
      name: api
    - port: 514
      targetPort: 514
      protocol: UDP
      name: syslog-udp
    - port: 514
      targetPort: 514
      protocol: TCP
      name: syslog-tcp
  selector:
    app: wazuh-manager
---
# TheHive Service
apiVersion: v1
kind: Service
metadata:
  name: thehive
  namespace: soc
  labels:
    app: thehive
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
      name: http
  selector:
    app: thehive
---
# Cortex Service
apiVersion: v1
