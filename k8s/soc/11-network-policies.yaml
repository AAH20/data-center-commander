---
# Default deny all ingress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: soc
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Default deny all egress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: soc
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
# Allow Wazuh Manager traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-wazuh-manager
  namespace: soc
spec:
  podSelector:
    matchLabels:
      app: wazuh-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: wazuh-agent
        - podSelector:
            matchLabels:
              app: soc-dashboard
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 1514
        - protocol: TCP
          port: 1515
        - protocol: TCP
          port: 55000
        - protocol: UDP
          port: 514
        - protocol: TCP
          port: 514
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: elasticsearch-soc
      ports:
        - protocol: TCP
          port: 9200
---
# Allow Wazuh Agent traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-wazuh-agent
  namespace: soc
spec:
  podSelector:
    matchLabels:
      app: wazuh-agent
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: wazuh-manager
      ports:
        - protocol: TCP
          port: 1514
        - protocol: TCP
          port: 1515
---
# Allow TheHive traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-thehive
  namespace: soc
spec:
  podSelector:
    matchLabels:
      app: thehive
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: soc-dashboard
        - podSelector:
            matchLabels:
              app: cortex
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 9000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: elasticsearch-soc
      ports:
        - protocol: TCP
          port: 9200
    - to:
        - podSelector:
            matchLabels:
              app: cortex
      ports:
        - protocol: TCP
          port: 9001
---
# Allow Cortex traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cortex
  namespace: soc
spec:
  podSelector:
    matchLabels:
      app: cortex
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: thehive
        - podSelector:
            matchLabels:
              app: soc-dashboard
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 9001
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: elasticsearch-soc
      ports:
        - protocol: TCP
          port: 9200
---
# Allow Elasticsearch SOC traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-elasticsearch-soc
  namespace: soc
spec:
  podSelector:
    matchLabels:
      app: elasticsearch-soc
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: wazuh-manager
        - podSelector:
            matchLabels:
              app: thehive
        - podSelector:
            matchLabels:
              app: cortex
        - podSelector:
            matchLabels:
              app: soc-dashboard
        - podSelector:
            matchLabels:
              app: fluentd-soc
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 9200
        - protocol: TCP
          port: 9300
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: elasticsearch-soc
---
# Allow PostgreSQL traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  namespace: soc
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: thehive
        - podSelector:
            matchLabels:
              app: cortex
      ports:
        - protocol: TCP
          port: 5432
  egress: []
---
# Allow SOC Dashboard traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-soc-dashboard
  namespace: soc
spec:
  podSelector:
    matchLabels:
      app: soc-dashboard
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: elasticsearch-soc
      ports:
        - protocol: TCP
          port: 9200
    - to:
        - podSelector:
            matchLabels:
              app: thehive
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              app: cortex
      ports:
        - protocol: TCP
          port: 9001
---
# Allow Alertmanager traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager
  namespace: soc
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: soc-dashboard
      ports:
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 9094
  egress: []
---
# Allow Fluentd SOC traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fluentd-soc
  namespace: soc
spec:
  podSelector:
    matchLabels:
      app: fluentd-soc
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: wazuh-manager
        - podSelector:
            matchLabels:
              app: thehive
        - podSelector:
            matchLabels:
              app: cortex
      ports:
        - protocol: TCP
          port: 24224
        - protocol: UDP
          port: 24224
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: elasticsearch-soc
      ports:
        - protocol: TCP
          port: 9200
---
# Allow Trivy traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-trivy
  namespace: soc
spec:
  podSelector:
    matchLabels:
      app: trivy
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: elasticsearch-soc
      ports:
        - protocol: TCP
          port: 9200
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
