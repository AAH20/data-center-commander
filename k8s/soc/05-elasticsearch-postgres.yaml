---
# Elasticsearch SOC Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-soc
  namespace: soc
  labels:
    app: elasticsearch-soc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch-soc
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: elasticsearch-soc
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
          ports:
            - containerPort: 9200
              name: http
              protocol: TCP
            - containerPort: 9300
              name: transport
              protocol: TCP
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.security.enrollment.enabled
              value: "false"
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: xpack.security.transport.ssl.enabled
              value: "false"
            - name: ELASTIC_PASSWORD
              value: "SecretPassword"
            - name: ES_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
            - name: cluster.routing.allocation.disk.threshold_enabled
              value: "false"
            - name: ingest.geoip.downloader.enabled
              value: "false"
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "1000m"
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
              httpHeaders:
                - name: Authorization
                  value: "Basic YWRtaW46U2VjcmV0UGFzc3dvcmQ="
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
              httpHeaders:
                - name: Authorization
                  value: "Basic YWRtaW46U2VjcmV0UGFzc3dvcmQ="
            initialDelaySeconds: 60
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: elasticsearch-soc-data
---
# PostgreSQL Deployment (for TheHive + Cortex)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: soc
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: "soc_admin"
            - name: POSTGRES_PASSWORD
              value: "soc_admin_password"
            - name: POSTGRES_DB
              value: "thehive"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - soc_admin
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - soc_admin
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
# Alertmanager Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: soc
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          ports:
            - containerPort: 9093
              name: http
              protocol: TCP
            - containerPort: 9094
              name: cluster
              protocol: TCP
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=:9093
            - --cluster.listen-address=:9094
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "100m"
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          emptyDir: {}
---
# SOC Dashboard (Grafana) Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soc-dashboard
  namespace: soc
  labels:
    app: soc-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soc-dashboard
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: soc-dashboard
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "soc_admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "soc_admin_password"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_INSTALL_PLUGINS
              value: "marcusolsson-json-datasource,grafana-piechart-panel"
            - name: GF_SERVER_ROOT_URL
              value: "https://soc-dashboard.local/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: provisioning
          configMap:
            name: soc-dashboard-provisioning
        - name: dashboards
          configMap:
            name: soc-dashboard-provisioning
        - name: data
          emptyDir: {}
---
# Fluentd SOC DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd-soc
  namespace: soc
  labels:
    app: fluentd-soc
spec:
  selector:
    matchLabels:
      app: fluentd-soc
  template:
    metadata:
      labels:
        app: fluentd-soc
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: fluentd
          image: fluent/fluentd:v1.17-1
          ports:
            - containerPort: 24224
              name: forward
              protocol: TCP
            - containerPort: 24224
              name: forward-udp
              protocol: UDP
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "100m"
          volumeMounts:
            - name: config
              mountPath: /fluentd/etc/fluent.conf
              subPath: fluent.conf
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: soc-logs
              mountPath: /var/log/soc
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: fluentd-soc-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: soc-logs
          hostPath:
            path: /var/log/soc
---
# Trivy Scanner Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trivy
  namespace: soc
  labels:
    app: trivy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trivy
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: trivy
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: trivy
          image: aquasec/trivy:0.55.0
          command:
            - sh
            - -c
            - |
              while true; do
                trivy fs --scanners vuln,secret,config \
                  --severity CRITICAL,HIGH,MEDIUM,LOW \
                  --format json --output /reports/trivy-report.json \
                  /scan 2>/dev/null || true
                sleep 3600
              done
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: config
              mountPath: /root/.cache/trivy/trivy.yaml
              subPath: trivy.yaml
            - name: reports
              mountPath: /reports
            - name: scan-target
              mountPath: /scan
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: trivy-config
        - name: reports
          persistentVolumeClaim:
            claimName: soc-reports
        - name: scan-target
          hostPath:
            path: /
