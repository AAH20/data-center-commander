---
# Wazuh Manager PDB
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wazuh-manager
  namespace: soc
  labels:
    app: wazuh-manager
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: wazuh-manager
