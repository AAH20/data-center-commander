apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: data-center-commander
  labels:
    team: platform-engineering
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: data-center-commander
  labels:
    team: platform-engineering
spec:
  podSelector: {}
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-elasticsearch
  namespace: data-center-commander
  labels:
    team: platform-engineering
spec:
  podSelector:
    app: elasticsearch
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: logstash
    - podSelector:
        matchLabels:
          app: kibana
    - podSelector:
        matchLabels:
          app: log-processor
    ports:
    - protocol: TCP
      port: 9200
    - protocol: TCP
      port: 9300
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: elasticsearch
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-logstash
  namespace: data-center-commander
  labels:
    team: platform-engineering
spec:
  podSelector:
    app: logstash
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: filebeat
    - podSelector:
        matchLabels:
          app: fluentd
    ports:
    - protocol: TCP
      port: 5044
    - protocol: TCP
      port: 5000
    - protocol: UDP
      port: 5000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: elasticsearch
    ports:
    - protocol: TCP
      port: 9200
---
