apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: data-center-commander
  labels:
    app: filebeat
    team: platform-engineering
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
  labels:
    app: filebeat
    team: platform-engineering
rules:
- apiGroups:
  - ''
  resources:
  - namespaces
  - pods
  - nodes
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - ''
  resources:
  - nodes/stats
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
  labels:
    app: filebeat
    team: platform-engineering
subjects:
- kind: ServiceAccount
  name: filebeat
  namespace: data-center-commander
roleRef:
  kind: ClusterRole
  name: filebeat
  apiGroup: rbac.authorization.k8s.io
