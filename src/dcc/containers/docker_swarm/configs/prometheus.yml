# Prometheus configuration for DCC monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: dcc-swarm
    replica: '{{.ExternalURL}}'

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'dcc-app'
    dns_sd_configs:
      - names: ['app']
        type: A
        port: 8790
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: 'dcc-nginx'
    dns_sd_configs:
      - names: ['nginx']
        type: A
        port: 80
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: 'otel-collector'
    dns_sd_configs:
      - names: ['otel-collector']
        type: A
        port: 8888
    metrics_path: /metrics
    scrape_interval: 30s
