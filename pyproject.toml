[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-center-commander"
version = "0.1.0"
description = "Read-only, energy-to-compute data-center operations command view"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.2,<4"]
test = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-timeout>=2.3,<3.0",
    "httpx>=0.27,<1.0",
    "hypothesis>=6.100,<7.0",
    "checkov>=3.2,<4.0",
    "pyyaml>=6.0,<7.0",
]
async = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "redis>=5.0,<6.0",
    "pydantic>=2.0,<3.0",
]
lint = [
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]
security = [
    "bandit>=1.7,<2.0",
    "safety>=3.0,<4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "improvements"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

# Vendored scanner policy modules (checkov/tracing) ship their own guard style:
# deeply nested isinstance/port checks where merging conditions would obscure
# intent, and loop variables kept for readability. Lint project code, not these.
[tool.ruff.lint.per-file-ignores]
"policies/**" = ["SIM102", "SIM110", "SIM114", "B007", "N802"]
"tracing/**" = ["SIM102", "SIM110", "SIM114", "B007", "N802"]
"docker/**" = ["SIM102", "SIM110", "SIM114", "B007", "N802"]
"security/**" = ["SIM102", "SIM110", "SIM114", "B007", "N802"]
"logging/**" = ["SIM102", "SIM110", "SIM114", "B007", "N802"]
"monitoring/**" = ["SIM102", "SIM110", "SIM114", "B007", "N802"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
