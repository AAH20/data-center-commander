[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-center-commander"
version = "0.1.0"
description = "Read-only, energy-to-compute data-center operations command view"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.2,<4"]
tracing = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    "opentelemetry-exporter-jaeger>=1.20",
]
test = ["psycopg[binary,pool]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
]

[tool.pytest.ini_options]
# `tests/__init__.py` exists but the subdirectories did not, so pytest's default
# "prepend" import mode computed the SAME module name for files sharing a basename
# in different directories (tests/compliance/test_models.py vs
# tests/test_cost_optimization/test_models.py) and aborted collection.
# NOTE: `importmode = "importlib"` is NOT accepted by this pytest version
# ("Unknown config option"), so the collision is fixed with __init__.py packages
# instead, which works on every version.
testpaths = ["tests"]
