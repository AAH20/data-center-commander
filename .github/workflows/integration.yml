name: Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dcc_test
          POSTGRES_PASSWORD: dcc_test_password
          POSTGRES_DB: dcc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # checkov is imported by tests/compliance/checkov; without it pytest aborts
        # with "Interrupted: 1 error during collection" and the job fails having run
        # no integration tests at all.
        run: pip install -e ".[test,checkov]"
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432; do
            sleep 1
          done
      - name: Run migrations
        env:
          HYPOTHESIS_PROFILE: ci
          DCC_DATABASE_URL: postgresql://dcc_test:dcc_test_password@localhost:5432/dcc_test
        run: |
          # ON_ERROR_STOP is not optional. Without it psql prints ERROR, skips the
          # failing statement and exits 0 -- so three migrations that aborted on a
          # fresh database, and a materialized view left in the wrong shape, all
          # reported success. A gate that cannot fail is indistinguishable from one
          # that does not run.
          psql "$DCC_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/schema.sql
          for f in database/migrations/*.sql; do
            echo "  applying $(basename "$f")"
            psql "$DCC_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Verify a fresh database builds and serves
        # Proves the schema loads AND that the application can read it: every GET
        # /v2 route is exercised against the migrated database with a real key.
        env:
          DCC_DATABASE_URL: postgresql://dcc_test:dcc_test_password@localhost:5432/dcc_test
          PYTHONPATH: src
        run: scripts/verify-fresh-deploy.sh
      - name: Seed demo data
        env:
          DCC_DATABASE_URL: postgresql://dcc_test:dcc_test_password@localhost:5432/dcc_test
        run: |
          psql "$DCC_DATABASE_URL" -f database/demo_seed.sql
      - name: Run integration tests
        # BLOCKING. This step was continue-on-error, justified by "the suite genuinely
        # has 636 failing tests" and by tests/terraform asserting against a module layout
        # that does not exist. Both are false now: the modules live in iac/modules and
        # tests/terraform is 865 passed, 0 failed. The suite runs green against a real
        # database, which is the whole point of this job.
        #
        # Excluded for capability, not for being red:
        #   tests/e2e            needs a Chromium binary and a running server
        #   tests/iac-performance is RED (50 failed of 86) and takes 44 minutes
        #   tests/iac-visual     needs 7 view baselines not yet generated
        # tests/terraform is no longer excluded -- it is pure-Python HCL parsing and
        # completes in under a second.
        env:
          DCC_DATABASE_URL: postgresql://dcc_test:dcc_test_password@localhost:5432/dcc_test
          PYTHONPATH: src
        run: |
          # The suite is pytest (71 files import pytest, pyproject declares
          # [tool.pytest.ini_options]); `unittest discover` cannot collect it.
          python -m pytest tests/ -q -p no:cacheprovider \
            --ignore=tests/e2e \
            --ignore=tests/iac-performance \
            --ignore=tests/iac-visual
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
