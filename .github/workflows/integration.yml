name: Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dcc_test
          POSTGRES_PASSWORD: dcc_test_password
          POSTGRES_DB: dcc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[test]"
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432; do
            sleep 1
          done
      - name: Run migrations
        env:
          DCC_DATABASE_URL: postgresql://dcc_test:dcc_test_password@localhost:5432/dcc_test
        run: |
          psql "$DCC_DATABASE_URL" -f database/schema.sql
          for f in database/migrations/*.sql; do
            psql "$DCC_DATABASE_URL" -f "$f"
          done
      - name: Seed demo data
        env:
          DCC_DATABASE_URL: postgresql://dcc_test:dcc_test_password@localhost:5432/dcc_test
        run: |
          psql "$DCC_DATABASE_URL" -f database/demo_seed.sql
      - name: Run integration tests
        env:
          DCC_DATABASE_URL: postgresql://dcc_test:dcc_test_password@localhost:5432/dcc_test
          PYTHONPATH: src
        run: |
          # pytest suite (71 files import pytest); unittest discover cannot collect
          # it. e2e needs a browser against a running app; terraform asserts against
          # a module layout that does not exist.
          python -m pytest tests/ -q -p no:cacheprovider \
            --ignore=tests/e2e --ignore=tests/terraform
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
