name: IaC CI/CD

on:
  pull_request:
    paths:
      - "terraform/**"
      - "opentofu/**"
      - "policies/**"
      - ".github/workflows/iac-cicd.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "opentofu/**"
      - "policies/**"
      - ".github/workflows/iac-cicd.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to perform"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - production

permissions:
  contents: read
  id-token: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.8"
  TOFU_VERSION: "1.8.4"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Discover changed Terraform/OpenTofu directories
  # ─────────────────────────────────────────────────────────────────────────
  discover:
    name: Discover changed IaC
    runs-on: ubuntu-latest
    outputs:
      directories: ${{ steps.set-dirs.outputs.directories }}
      has_changes: ${{ steps.set-dirs.outputs.has_changes }}
      policy_only: ${{ steps.set-dirs.outputs.policy_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed Terraform directories
        id: set-dirs
        # Event context goes through env rather than being interpolated into the
        # shell. `${{ github.event.before }}` is hex in practice, but interpolating
        # any event field into a `run:` block is the documented injection pattern,
        # and quoting it costs nothing.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # SCOPE. This repository holds several unrelated terraform trees: iac/ and
          # infra/ are the managed ones; terraform/, logging/, nginx/ and tracing/ are
          # not part of this pipeline. An earlier revision scanned the whole tree,
          # which yields 88 directories and runs the full matrix -- including Terraform
          # Apply -- against every one of them. Only the managed roots are in scope.
          MANAGED="iac infra"

          scan_all() {
            for root in $MANAGED; do
              [ -d "$root" ] && find "$root" -name "*.tf" -exec dirname {} \; 2>/dev/null
            done | sort -u
          }

          policy_only=false
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            dirs=$(scan_all | jq -R . | jq -cs .)
          elif echo "$changed" | grep -qE '^(policies/|\.github/workflows/iac-cicd\.yml)'; then
            # A policy or pipeline change. The policy jobs must re-run; planning,
            # applying and drift-detecting every module because a .rego file moved
            # must not.
            dirs="[]"
            policy_only=true
          else
            dirs=$(echo "$changed" | grep -E '\.tf$' | xargs -I{} dirname {} 2>/dev/null \
                   | sort -u | jq -R . | jq -cs .)
          fi

          echo "directories=$dirs" >> "$GITHUB_OUTPUT"
          echo "policy_only=$policy_only" >> "$GITHUB_OUTPUT"
          if [ "$dirs" != "[]" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed directories: $dirs"
          echo "Policy-only change: $policy_only"

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Terraform Format & Validate
  # ─────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate & Format
    runs-on: ubuntu-latest
    needs: discover
    if: needs.discover.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJson(needs.discover.outputs.directories) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false

      - name: Terraform Format Check
        working-directory: ${{ matrix.directory }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Security Scan — tfsec
  # ─────────────────────────────────────────────────────────────────────────
  tfsec:
    name: tfsec Security Scan
    runs-on: ubuntu-latest
    needs: discover
    if: needs.discover.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJson(needs.discover.outputs.directories) }}
    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ matrix.directory }}
          soft_fail: false
          format: sarif
          out: tfsec-results.sarif

      - name: Upload tfsec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec-results.sarif
          category: tfsec

      - name: Upload tfsec report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfsec-report-${{ matrix.directory }}
          path: tfsec-results.sarif
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # 4. Security Scan — Checkov
  # ─────────────────────────────────────────────────────────────────────────
  checkov:
    name: Checkov Policy Scan
    runs-on: ubuntu-latest
    needs: discover
    if: needs.discover.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJson(needs.discover.outputs.directories) }}
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ matrix.directory }}
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: false
          download_external_modules: true

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
          category: checkov

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report-${{ matrix.directory }}
          path: checkov-results.sarif
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # 4b. Governance Gate — prove the policies can fail
  # ─────────────────────────────────────────────────────────────────────────
  policy-gate:
    name: Governance Gate Self-Test
    runs-on: ubuntu-latest
    needs: discover
    # Runs whenever the policies themselves could have changed. This is the job that
    # distinguishes a gate that works from a gate that silently matches nothing --
    # the failure mode this repository had, where Conftest reported SUCCESS for months
    # while evaluating an input shape nothing produced.
    if: |
      needs.discover.outputs.has_changes == 'true' ||
      needs.discover.outputs.policy_only == 'true'
    steps:
      - uses: actions/checkout@v4

      # OPA directly rather than Conftest. Conftest bundles its own OPA, and an older
      # Conftest bundles an OPA old enough to reject Rego v1 -- which fails as a wall
      # of parse errors that reads like a policy problem. One static binary with a
      # pinned version removes that variable.
      - name: Install OPA
        run: |
          curl -sSL -o /usr/local/bin/opa \
            https://open-policy-agent.github.io/gopa/releases/download/v1.21.1/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version | head -3

      - name: Assert the gate accepts a compliant plan and rejects a violating one
        run: bash policies/rego/selftest.sh

      - name: Assert a default_tags-only plan is not reported as untagged
        # infra/aws-gpu-h200 relies entirely on provider default_tags. Those do not
        # appear in change.after.tags, so a resource-level-only check reports every
        # resource in a correctly tagged module as untagged. This asserts the rule
        # reads the provider configuration too.
        run: |
          cat > /tmp/default-tags-plan.json <<'JSON'
          {
            "configuration": {"provider_config": {"aws": {"name": "aws", "expressions": {
              "default_tags": {"tags": {
                "Project":     {"constant_value": "data-center-commander"},
                "Environment": {"references": ["var.environment"]},
                "CostCenter":  {"references": ["var.cost_center"]}
              }}}}}},
            "resource_changes": [
              {"address": "aws_vpc.this", "type": "aws_vpc",
               "change": {"actions": ["create"], "after": {"Name": "dcc-h200-vpc"}}}
            ]
          }
          JSON
          out=$(opa eval -d policies/rego/tfplan_governance.rego \
                  -i /tmp/default-tags-plan.json \
                  data.datacenter.tfplan_governance.deny --format raw)
          if echo "$out" | grep -q "missing mandatory tag"; then
            echo "::error::A plan inheriting mandatory tags from default_tags was reported untagged."
            exit 1
          fi
          echo "default_tags correctly recognised."

  # ─────────────────────────────────────────────────────────────────────────
  # 5. Compliance Scan — OPA/Conftest with custom policies
  # ─────────────────────────────────────────────────────────────────────────
  compliance:
    name: OPA Compliance Scan
    runs-on: ubuntu-latest
    needs: discover
    # Scans a directory, so it needs one. A policy-only change leaves `directories`
    # empty, and a job whose `if:` is true but whose matrix is empty cannot expand --
    # GitHub marks it skipped with zero steps and fails the whole run. Policy changes
    # are validated by the policy-gate job instead.
    if: needs.discover.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJson(needs.discover.outputs.directories) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false

      - name: Terraform Plan (JSON)
        working-directory: ${{ matrix.directory }}
        run: terraform plan -input=false -no-color -out=tfplan.binary && terraform show -json tfplan.binary > tfplan.json

      - name: Setup Conftest
        # 0.71.1 bundles OPA 1.21.1. The previous 0.56.0 bundled OPA 0.69.0, which
        # rejects the Rego v1 syntax these policies are written in -- it failed with
        # "rego_parse_error: var cannot be used for rule name" on 1151 lines and
        # checked nothing. This matches OPA_VERSION already pinned in soc-cicd.yml.
        run: |
          wget -q -O conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz
          tar xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Run Conftest policy check
        working-directory: ${{ matrix.directory }}
        run: |
          # policies/tfsec/ holds tfsec custom rules in JSON; Conftest evaluates
          # Rego. Pointing it at tfsec/ meant this step never checked anything --
          # there was not a single .rego file in the directory it was given.
          conftest test tfplan.json \
            --policy ../policies/rego/ \
            --all-namespaces \
            --output table \
            2>&1 | tee conftest-results.txt
          exit ${PIPESTATUS[0]}

      - name: Verify the governance gate can fail
        # Runs the policy against a known-compliant and a known-violating plan.
        # Without this, a policy that silently stops matching would look identical
        # to one that passes -- which is exactly how this repo's OPA scan reported
        # SUCCESS for months while evaluating nothing.
        run: bash policies/rego/selftest.sh

      - name: Upload Conftest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conftest-report-${{ matrix.directory }}
          path: ${{ matrix.directory }}/conftest-results.txt
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # 6. Sentinel Policy Check (if Sentinel CLI available)
  # ─────────────────────────────────────────────────────────────────────────
  sentinel:
    name: Sentinel Policy Check
    runs-on: ubuntu-latest
    needs: discover
    # Policy gates re-run on a policy change even when no .tf file moved, otherwise
    # editing a .rego or .sentinel file would never be validated by the job that reads it.
    if: |
      needs.discover.outputs.has_changes == 'true' ||
      needs.discover.outputs.policy_only == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Check Sentinel policies exist
        id: check
        run: |
          if [ -d "policies/sentinel" ] && [ -n "$(ls -A policies/sentinel/*.sentinel 2>/dev/null)" ]; then
            echo "has_policies=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_policies=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Sentinel
        if: steps.check.outputs.has_policies == 'true'
        run: |
          wget -q -O sentinel.zip https://releases.hashicorp.com/sentinel/0.28.0/sentinel_0.28.0_linux_amd64.zip
          unzip -o sentinel.zip
          sudo mv sentinel /usr/local/bin/
          sentinel version

      - name: Run Sentinel test
        if: steps.check.outputs.has_policies == 'true'
        run: |
          sentinel test -verbose -run=all 2>&1 | tee sentinel-results.txt
          exit ${PIPESTATUS[0]}
        working-directory: policies/sentinel

      - name: Upload Sentinel results
        if: steps.check.outputs.has_policies == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-report
          path: policies/sentinel/sentinel-results.txt
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # 7. Infracost — Cost estimation
  # ─────────────────────────────────────────────────────────────────────────
  infracost:
    name: Cost Estimation
    runs-on: ubuntu-latest
    needs: discover
    if: needs.discover.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJson(needs.discover.outputs.directories) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate cost estimate
        working-directory: ${{ matrix.directory }}
        run: |
          infracost breakdown --path . \
            --format json \
            --out-file infracost.json \
            --show-skipped

      - name: Post cost comment to PR
        if: github.event_name == 'pull_request'
        uses: infracost/actions/comment@v3
        with:
          path: ${{ matrix.directory }}/infracost.json
          behavior: update

      - name: Upload Infracost report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infracost-report-${{ matrix.directory }}
          path: ${{ matrix.directory }}/infracost.json
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # 8. Terraform Plan (PR)
  # ─────────────────────────────────────────────────────────────────────────
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [discover, validate, tfsec, checkov, compliance]
    if: |
      always() &&
      needs.discover.outputs.has_changes == 'true' &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped') &&
      (needs.tfsec.result == 'success' || needs.tfsec.result == 'skipped') &&
      (needs.checkov.result == 'success' || needs.checkov.result == 'skipped') &&
      (needs.compliance.result == 'success' || needs.compliance.result == 'skipped') &&
      github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJson(needs.discover.outputs.directories) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: ${{ matrix.directory }}
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: ${{ matrix.directory }}
        run: terraform plan -input=false -no-color -out=tfplan.binary 2>&1 | tee plan-output.txt

      - name: Generate plan summary
        working-directory: ${{ matrix.directory }}
        run: |
          echo "## Terraform Plan: ${{ matrix.directory }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan.binary >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.directory }}
          path: ${{ matrix.directory }}/tfplan.binary
          retention-days: 5

  # ─────────────────────────────────────────────────────────────────────────
  # 9. Drift Detection
  # ─────────────────────────────────────────────────────────────────────────
  drift-detection:
    name: Drift Detection
    runs-on: ubuntu-latest
    needs: discover
    if: |
      always() &&
      needs.discover.outputs.has_changes == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJson(needs.discover.outputs.directories) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: ${{ matrix.directory }}
        run: terraform init -input=false

      - name: Detect drift
        working-directory: ${{ matrix.directory }}
        run: |
          terraform plan -input=false -no-color -detailed-exitcode -out=drift.binary 2>&1 | tee drift-output.txt
          exit_code=${PIPESTATUS[0]}
          # Exit code 0 = no drift, 2 = drift detected
          if [ "$exit_code" -eq 2 ]; then
            echo "::warning::Drift detected in ${{ matrix.directory }}"
            echo "## ⚠️ Drift Detected: ${{ matrix.directory }}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            terraform show -no-color drift.binary >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$exit_code" -eq 0 ]; then
            echo "No drift detected in ${{ matrix.directory }}"
          else
            echo "::error::Terraform plan failed in ${{ matrix.directory }}"
            exit 1
          fi

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-${{ matrix.directory }}
          path: ${{ matrix.directory }}/drift-output.txt
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # 10. Terraform Apply (manual dispatch only)
  # ─────────────────────────────────────────────────────────────────────────
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [discover, validate, tfsec, checkov, compliance, plan]
    # Apply requires an explicit dispatch. It previously also ran on any push to main,
    # so a commit could trigger applies across every discovered directory.
    # Infrastructure changes are not a side effect of a commit.
    #
    # NOTE: comments cannot go inside an `if: |` block scalar -- the `#` is literal text
    # there, and GitHub rejects the entire workflow file with "workflow file issue".
    if: |
      always() &&
      needs.discover.outputs.has_changes == 'true' &&
      github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    environment:
      name: ${{ inputs.environment || 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJson(needs.discover.outputs.directories) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: ${{ matrix.directory }}
        run: terraform init -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.directory }}
          path: ${{ matrix.directory }}

      - name: Terraform Apply
        working-directory: ${{ matrix.directory }}
        run: terraform apply -input=false -no-color tfplan.binary 2>&1 | tee apply-output.txt

      - name: Upload apply report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apply-report-${{ matrix.directory }}
          path: ${{ matrix.directory }}/apply-output.txt
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # 11. OpenTofu Plan (alternative to Terraform)
  # ─────────────────────────────────────────────────────────────────────────
  opentofu-plan:
    name: OpenTofu Plan
    runs-on: ubuntu-latest
    needs: discover
    if: |
      always() &&
      needs.discover.outputs.has_changes == 'true' &&
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: OpenTofu Init
        working-directory: opentofu
        run: tofu init -backend=false -input=false

      - name: OpenTofu Format Check
        working-directory: opentofu
        run: tofu fmt -check -recursive

      - name: OpenTofu Validate
        working-directory: opentofu
        run: tofu validate

      - name: OpenTofu Plan
        working-directory: opentofu
        run: tofu plan -input=false -no-color -out=tofu-plan.binary 2>&1 | tee tofu-plan-output.txt

      - name: Upload OpenTofu plan
        uses: actions/upload-artifact@v4
        with:
            name: tofu-plan
            path: opentofu/tofu-plan.binary
            retention-days: 5

  # ─────────────────────────────────────────────────────────────────────────
  # 12. Summary
  # ─────────────────────────────────────────────────────────────────────────
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [discover, validate, tfsec, checkov, compliance, sentinel, infracost, plan, drift-detection, apply, opentofu-plan]
    if: always()
    steps:
      - name: Pipeline summary
        run: |
          echo "## IaC CI/CD Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Validate | ${{ needs.validate.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| tfsec | ${{ needs.tfsec.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Checkov | ${{ needs.checkov.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| OPA Compliance | ${{ needs.compliance.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Sentinel | ${{ needs.sentinel.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Infracost | ${{ needs.infracost.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Terraform Plan | ${{ needs.plan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Drift Detection | ${{ needs.drift-detection.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Terraform Apply | ${{ needs.apply.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| OpenTofu Plan | ${{ needs.opentofu-plan.result }} |" >> "$GITHUB_STEP_SUMMARY"
