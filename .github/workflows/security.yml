name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit SAST
        run: bandit -r src/ -f json -o bandit-report.json || true
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 7

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: pip-audit --strict

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # CodeQL failed with "This job attempted to run with improved incremental analysis but it
      # did not complete successfully. One possible reason for this is disk space constraints".
      # It is not a code finding and not a regression: the same analysis passed on the previous
      # commit, and the commit that broke it changed only .gitignore and some JavaScript.
      #
      # The supported way to turn improved incremental analysis off is the
      # github-codeql-disable-overlay repository property, and that property can only be set on
      # an organization repository. This is a personal repository, so the documented remedy
      # applies instead: give the analysis more room. ubuntu-latest carries several GB of
      # toolchains a Python-only analysis never touches.
      #
      # The alternative -- marking this job continue-on-error -- would turn a real code scanning
      # gate into decoration, which is the exact defect the rest of these workflows were repaired
      # for. Reclaim the space instead.
      - name: Free disk space for the analysis database
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc \
            /usr/share/swift \
            || true
          echo "after:"; df -h / | tail -1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
