name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install ruff
      - name: Ruff lint
        # Advisory, with a MEASURED count rather than a remembered one: 3,413 findings
        # across 19 rule classes, 2,806 auto-fixable. Not blocking until the backlog is
        # worked down, because a gate that is always red is ignored. Update this number
        # when it moves materially -- a stale figure is how an exemption outlives its
        # reason, which is exactly what happened to the test gate below.
        continue-on-error: true
        run: ruff check src/ tests/
      - name: Ruff format check
        # Advisory: 434 of 493 files are unformatted. This is a separate backlog from the
        # lint findings above -- the two steps used to carry an identical copied comment
        # claiming the same 3,700+ figure, which was wrong for both. Not blocking until a
        # formatting pass lands.
        continue-on-error: true
        run: ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install type check tools
        # types-psycopg does not exist on PyPI (pip: 'No matching distribution
        # found'), and psycopg 3 ships its own py.typed, so no stub package is
        # needed. Requesting a nonexistent one failed the install, which meant
        # mypy never ran at all.
        run: pip install mypy
      - name: MyPy type check
        continue-on-error: true   # advisory, same reason as lint
        run: mypy src/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    # The suite takes ~15+ minutes at CI scope (the full suite is ~81 minutes), so the
    # previous 15-minute cap killed the job mid-run and reported it as "cancelled" --
    # which looked like a concurrency problem and was not one. Raised to 45 so the
    # job can actually finish and report a real number.
    timeout-minutes: 45
    # A real PostgreSQL, because part of this suite measures a real database: the
    # /v2/overview provenance tests assert live/synthetic status read from stored rows,
    # and five of them fail with 503 database_not_configured when none is reachable.
    # Advertising DCC_DATABASE_URL at a host with no server behind it is worse than
    # either extreme -- it makes "the database is unreachable" look like a test failure.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dcc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # checkov is imported by tests/compliance: without it pytest aborts with
        # "Interrupted: 1 error during collection" and the job fails having run no
        # compliance tests at all. The suite step below also installs coverage and
        # checkov again; this one has to be complete so the migration step's tooling
        # is present.
        run: pip install -e ".[test,checkov]"

      # tests/iac-performance shells out to `terraform` and `opa`. Without them the
      # directory does not fail -- it reports "22 passed, 71 skipped", which is green and
      # covers one fifth of itself. The verify step below turns that silent skip into a
      # loud failure, because a gate that reports success for work it did not do is the
      # exact defect this workflow has spent its life removing.
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install Open Policy Agent
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSL -o "$RUNNER_TEMP/bin/opa" \
            https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x "$RUNNER_TEMP/bin/opa"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Verify IaC test tools are present
        # If either binary is missing the performance suite degrades to skips instead of
        # failures, so verify them here rather than trusting the suite's green.
        run: |
          terraform version
          opa version

      # This gate is BLOCKING. It used to be continue-on-error: true, justified by
      # "636 pre-existing failures, 334 of them terraform tests targeting
      # terraform/modules/aws/vpc". That layout no longer exists -- the modules moved to
      # iac/modules -- and tests/terraform is now 865 passed, 0 failed. The backlog the
      # exemption was granted for is gone, so the exemption goes with it.
      #
      # A non-blocking test step is a gate that cannot fail: the suite could go entirely
      # red and the pipeline would stay green. That is the worst kind of control, because
      # the badge asserts something nobody is checking.
      #
      # Excluded, each for a stated capability gap rather than for being red:
      #   tests/e2e            needs a Chromium binary and a running server
      #   tests/iac-visual     needs a running server plus 7 baselines generated on the
      #                        same platform as the gate; fonts differ per runner image
      #   tests/performance    wall-clock microbenchmarks. This job is a 3-way Python
      #                        matrix on shared runners, and they are the noisiest thing
      #                        in it: a 0.14 ms budget was exceeded by 0.01 ms on one
      #                        runner while the same test passed in the single-job
      #                        integration workflow. Timing assertions belong in a
      #                        dedicated job, not in a parallel matrix -- the same
      #                        numbers are still enforced there.
      #
      # tests/iac-performance USED to be excluded here because it was red: 50 failed, 21
      # passed, 15 skipped, 44 minutes. It is now 92 passed, 1 skipped in 65 seconds, and
      # it runs in this job. Excluding a green tier because it used to be red is how a
      # gate shrinks to nothing while still looking like one.
      # Everything else runs. If a test in the included set is red, this job fails.
      - name: Prepare the test database
        env:
          DCC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dcc_test
        run: |
          until pg_isready -h localhost -p 5432; do sleep 1; done
          # ON_ERROR_STOP is not optional: without it psql prints ERROR, skips the
          # failing statement and exits 0, so a schema that never built reports success.
          psql "$DCC_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f database/schema.sql
          for f in database/migrations/*.sql; do
            psql "$DCC_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          # Seed, as integration.yml does. A schema-only database is not the state the
          # product runs in: the provenance tests assert live-vs-synthetic status read
          # from stored rows, and the backup restore test needs something to restore.
          # Without this they fail for a reason that has nothing to do with the change
          # under review -- an empty database looks like a broken query.
          psql "$DCC_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f database/demo_seed.sql

      - name: Run test suite
        env:
          PYTHONPATH: src
          DCC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dcc_test
          # tests/iac-fuzzing registers a "ci" profile at max_examples=100 alongside the
          # default 1000, but nothing ever selected it, so CI would have run 10x the
          # iterations. The suite takes 16 minutes at the default and 1.6 at this one.
          HYPOTHESIS_PROFILE: ci
        run: |
          # `unittest discover` was wrong here: the suite is pytest (71 files import
          # pytest, pyproject declares [tool.pytest.ini_options]), so unittest reported
          # them as _FailedTest collection errors and the job could never pass.
          pip install -e ".[test,checkov]" coverage
          coverage run -m pytest tests/ -q -p no:cacheprovider -rs \
            --ignore=tests/e2e \
            --ignore=tests/iac-visual \
            --ignore=tests/performance
          coverage report -m
          coverage xml
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: scripts
          severity: warning

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build
      - name: Build package
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  k8s-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        run: |
          # kubectl kustomize renders the kustomization tree purely locally. It needs
          # no API server, and it fails on a missing resource file, a bad patch, or an
          # unparseable manifest -- so this gate can actually pass or fail.
          #
          # The previous command was `kubectl apply --dry-run=client --validate=false -k
          # k8s/`, which still performs resource discovery against the API server even in
          # client mode. With no cluster that is "dial tcp [::1]:8080: connection refused"
          # every time, so the job was red on every run and never validated anything.
          kubectl kustomize k8s/ > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml || { echo "kustomize rendered nothing"; exit 1; }
          echo "rendered $(wc -l < /tmp/rendered.yaml) lines, $(grep -c '^---' /tmp/rendered.yaml) documents"

          # Schema validation when kubeconform is available; it is offline and
          # schema-driven, so it catches wrong apiVersion/kind and bad field types.
          if command -v kubeconform &>/dev/null; then
            kubeconform -strict -summary /tmp/rendered.yaml
          else
            echo "kubeconform not installed -- render validation only"
          fi

  iac-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # BLOCKING. This job used to be continue-on-error because the iac/ tree had a
    # provider-wiring defect: an ibm provider configuration was passed to
    # module.multi_cloud.module.ibm_compute, which did not declare the ibm-cloud/ibm
    # provider as required, so init failed. That was fixed by restructuring the
    # multi_cloud call site (a module that configures its own provider cannot be called
    # with `providers` or `count`), and `terraform validate` now reports success on
    # iac/root. Terraform warnings are still not errors -- only a failed validate,
    # fmt check, or policy gate fails this job.
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          opentofu_version: 1.6.0
      - name: OpenTofu fmt check
        run: |
          cd iac/root
          tofu fmt -check -recursive
      - name: OpenTofu validate
        run: |
          cd iac/root
          tofu init -backend=false
          tofu validate
      - name: tfsec security scan
        run: |
          if command -v tfsec &>/dev/null; then
            tfsec --config-file iac/policies/tfsec/tfsec.yml iac/
          else
            echo "tfsec not available — skipping IaC security scan"
          fi
