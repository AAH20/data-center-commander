name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install ruff
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install type check tools
        run: pip install mypy types-psycopg
      - name: MyPy type check
        run: mypy src/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[test]"

      # The suite was never run in CI: this workflow ran ruff/mypy/build only, and
      # integration.yml used `unittest discover`, which does not collect pytest-style
      # tests. A green badge therefore said nothing about the tests. This step makes
      # the real number visible. It is ADVISORY (continue-on-error) only until the 636
      # current failures are triaged -- 334 of them are terraform tests targeting
      # terraform/modules/aws/vpc, a layout that does not exist. Flip it to blocking
      # once the non-terraform failures reach zero, and fix the terraform suite against
      # the real module names rather than deleting it.
      - name: Run test suite (advisory -- 636 pre-existing failures)
        continue-on-error: true
        run: |
          env -u PYTHONPATH python -m pytest -q --no-header -p no:cacheprovider \
            --ignore=tests/terraform 2>&1 | tail -25
          echo "::warning::Full suite has 636 failures (334 terraform). See BENCHMARKS.md §1a."

      - name: Run tests with coverage
        env:
          PYTHONPATH: src
        run: |
          pip install coverage
          coverage run -m unittest discover -s tests -v
          coverage report -m
          coverage xml
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: scripts
          severity: warning

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build
      - name: Build package
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  k8s-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        run: |
          if command -v kubectl &>/dev/null; then
            kubectl apply --dry-run=client -k k8s/
          else
            echo "kubectl not available — skipping k8s manifest validation"
          fi

  iac-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          opentofu_version: 1.6.0
      - name: OpenTofu fmt check
        run: |
          cd iac/root
          tofu fmt -check -recursive
      - name: OpenTofu validate
        run: |
          cd iac/root
          tofu init -backend=false
          tofu validate
      - name: tfsec security scan
        run: |
          if command -v tfsec &>/dev/null; then
            tfsec --config-file iac/policies/tfsec/tfsec.yml iac/
          else
            echo "tfsec not available — skipping IaC security scan"
          fi
