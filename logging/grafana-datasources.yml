# Grafana datasource provisioning for Data Center Commander

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"(\w+)"'
          url: 'http://localhost:8790/v1/traces/$${__value.raw}'
    isDefault: true
    editable: false

