# Promtail configuration for Data Center Commander
# Ships application logs to Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576

scrape_configs:
  # Application logs
  - job_name: dcc-application
    static_configs:
      - targets:
          - localhost
        labels:
          job: dcc-application
          service: data-center-commander
          environment: ${DCC_ENV:-development}
          __path__: "/var/log/dcc/app/*.log"
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            timestamp: time
            logger: logger
            tenant_id: tenant_id
            request_id: request_id
      - labels:
          level:
          tenant_id:
          request_id:
      - timestamp:
          source: timestamp
          format: RFC3339

  # API access logs
  - job_name: dcc-api-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: dcc-api-access
          service: data-center-commander
          environment: ${DCC_ENV:-development}
          __path__: "/var/log/dcc/api/*.log"
    pipeline_stages:
      - json:
          expressions:
            method: method
            path: path
            status: status
            duration_ms: duration_ms
            tenant_id: tenant_id
            request_id: request_id
            remote_addr: remote_addr
      - labels:
          method:
          status:
          tenant_id:
      - timestamp:
          source: timestamp
          format: RFC3339

  # Error logs
  - job_name: dcc-errors
    static_configs:
      - targets:
          - localhost
        labels:
          job: dcc-errors
          service: data-center-commander
          environment: ${DCC_ENV:-development}
          __path__: "/var/log/dcc/errors/*.log"
    pipeline_stages:
      - json:
          expressions:
            level: level
            error: error
            stack: stack
            tenant_id: tenant_id
            request_id: request_id
      - labels:
          level:
          tenant_id:
      - timestamp:
          source: timestamp
          format: RFC3339

  # Audit/security logs
  - job_name: dcc-audit
    static_configs:
      - targets:
          - localhost
        labels:
          job: dcc-audit
          service: data-center-commander
          environment: ${DCC_ENV:-development}
          __path__: "/var/log/dcc/audit/*.log"
    pipeline_stages:
      - json:
          expressions:
            event_type: event_type
            actor: actor
            action: action
            resource: resource
            outcome: outcome
            tenant_id: tenant_id
      - labels:
          event_type:
          action:
          outcome:
          tenant_id:
      - timestamp:
          source: timestamp
          format: RFC3339
