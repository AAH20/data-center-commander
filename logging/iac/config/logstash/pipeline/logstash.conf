# Logstash Pipeline Configuration
# Processes logs from Filebeat, Fluentd, and TCP/UDP inputs

input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }

  tcp {
    port => 5000
    codec => json_lines
    type => "tcp_input"
  }

  udp {
    port => 5000
    codec => json
    type => "udp_syslog"
  }

  http {
    port => 8080
    codec => json
    type => "http_input"
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\s*\{/ {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }
  }

  # Enrich with environment metadata
  mutate {
    add_field => {
      "environment" => "${ENV:dev}"
      "datacenter" => "dc1"
      "iac_stack" => "true"
      "processed_by" => "logstash"
    }
  }

  # Parse timestamps
  date {
    match => ["timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSZ"]
    target => "@timestamp"
    timezone => "UTC"
  }

  # Extract log level
  if [parsed][level] {
    mutate {
      add_field => { "log_level" => "%{[parsed][level]}" }
    }
  } else if [message] =~ /(?i)(ERROR|WARN|INFO|DEBUG|TRACE)/ {
    grok {
      match => { "message" => "%{LOGLEVEL:log_level}" }
    }
  }

  # GeoIP enrichment for access logs
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }

  # Drop health check noise
  if [message] =~ /health|ping|heartbeat/ {
    drop { }
  }
}

output {
  # Route to Elasticsearch
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS}"]
    index => "iac-logs-%{+YYYY.MM.dd}"
    template_name => "iac-logs"
    template => "/usr/share/logstash/pipeline/iac-template.json"
    template_overwrite => true
  }

  # Also send to Loki via HTTP
  http {
    url => "${LOKI_URL:-http://loki:3100}/loki/api/v1/push"
    http_method => "post"
    content_type => "json"
    format => "json"
    mapping => {
      "streams" => [
        {
          "stream" => {
            "iac" => "true",
            "level" => "%{log_level}",
            "source" => "%{[@metadata][beat]}"
          }
          "values" => [
            ["%{@timestamp}", "%{message}"]
          ]
        }
      ]
    }
  }

  # Debug output (stdout)
  stdout {
    codec => rubydebug { metadata => true }
  }
}
