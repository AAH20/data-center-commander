# Fluentd Configuration
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<source>
  @type udp
  port 24224
  bind 0.0.0.0
  tag iac.udp
  <parse>
    @type json
  </parse>
</source>

<source>
  @type syslog
  port 5140
  bind 0.0.0.0
  tag iac.syslog
  <parse>
    @type syslog
  </parse>
</source>

# Filter: enrich all logs
<filter iac.**>
  @type record_transformer
  enable_ruby true
  <record>
    environment "#{ENV['ENV'] || 'dev'}"
    datacenter "dc1"
    processed_by "fluentd"
    hostname "#{Socket.gethostname}"
  </record>
</filter>

# Filter: parse JSON
<filter iac.**>
  @type parser
  key_name message
  reserve_data true
  <parse>
    @type json
  </parse>
</filter>

# Output to Elasticsearch
<match iac.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix iac-logs
  logstash_dateformat %Y.%m.%d
  include_tag_key true
  tag_key @log_name
  flush_interval 5s
  reload_on_failure true
  reconnect_on_error true
  request_timeout 15s
  <buffer>
    @type file
    path /var/log/fluent/buffer
    flush_mode interval
    flush_interval 5s
    retry_max_interval 30
    retry_forever true
    chunk_limit_size 8M
    queue_limit_length 256
    total_limit_size 5G
  </buffer>
</match>

# Output to Loki
<match iac.**>
  @type loki
  url http://loki:3100
  flush_interval 5s
  flush_at_shutdown true
  buffer_chunk_limit 1m
  buffer_queue_limit 32
  <label>
    job iac
    level ${record["level"] || "unknown"}
    service ${record["service"] || "unknown"}
  </label>
  <buffer>
    @type file
    path /var/log/fluent/loki-buffer
    flush_mode interval
    flush_interval 5s
    retry_forever true
  </buffer>
</match>
