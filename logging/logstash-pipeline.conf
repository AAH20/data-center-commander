# Logstash pipeline for ELK stack (optional)
# Uncomment the ELK services in docker-compose.yml to use

input {
  file {
    path => "/var/log/dcc/app/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
  }
  file {
    path => "/var/log/dcc/api/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
  }
  file {
    path => "/var/log/dcc/errors/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
  }
  file {
    path => "/var/log/dcc/audit/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
  }
}

filter {
  if [service] == "data-center-commander" {
    mutate {
      add_field => { "[@metadata][index]" => "dcc-logs" }
    }
  }

  # Parse timestamp if present
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Add environment tag
  mutate {
    add_field => { "environment" => "${DCC_ENV:development}" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
