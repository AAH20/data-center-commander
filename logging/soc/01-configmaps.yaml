---
# Fluent Bit Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: soc
  labels:
    app: fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Parser            docker
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [INPUT]
        Name              tail
        Tag               host.*
        Path              /var/log/*.log
        Parser            syslog
        DB                /var/log/flb_host.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

    [FILTER]
        Name                nest
        Match               kube.*
        Operation           lift
        Nested_under        kubernetes
        Add_prefix          k8s_

    [FILTER]
        Name                modify
        Match               kube.*
        Rename              k8s_pod_name       pod_name
        Rename              k8s_namespace_name namespace
        Rename              k8s_container_name container
        Rename              k8s_host           host
        Add                 cluster data-center-commander

    [FILTER]
        Name                grep
        Match               kube.*
        Regex               namespace^(?!soc|kube-system|ingress-nginx).*

    [OUTPUT]
        Name            loki
        Match           kube.*
        Host            loki
        Port            3100
        Labels          job=fluent-bit,namespace=$namespace,pod=$pod_name,container=$container
        Line_Format     json
        Drop_Records_With_Empty_Log On

    [OUTPUT]
        Name            loki
        Match           host.*
        Host            loki
        Port            3100
        Labels          job=fluent-bit,host=$host
        Line_Format     json

    [OUTPUT]
        Name            es
        Match           kube.*
        Host            elasticsearch
        Port            9200
        Index           soc-container-logs
        Type            _doc
        Logstash_Format On
        Logstash_Prefix soc-container
        Retry_Limit     5
        Suppress_Type_Name On

  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    [PARSER]
        Name        syslog
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<host>[^ ]+) (?<ident>[^:]*):(?<message>.*)$
        Time_Key    time
        Time_Format %b %d %H:%M:%S
---
# Loki Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: soc
  labels:
    app: loki
data:
  local-config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    ruler:
      alertmanager_url: http://alertmanager:9093
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
      retention_period: 720h
---
# Grafana Provisioning
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: soc
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: true
        editable: true
      - name: Elasticsearch
        type: elasticsearch
        access: proxy
        url: http://elasticsearch:9200
        editable: true
        database: "soc-*"
        jsonData:
          timeField: "@timestamp"
          esVersion: "8.0.0"
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: soc
        orgId: 1
        folder: "SOC"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
# SOC Alerting Rules (PrometheusRule)
apiVersion: v1
kind: ConfigMap
metadata:
  name: soc-alert-rules
  namespace: soc
  labels:
    app: soc
data:
  soc-rules.yml: |
    groups:
      - name: soc-container-alerts
        rules:
          - alert: HighErrorRate
            expr: |
              sum(rate({job="fluent-bit", container!=""} | json | __error__ != "" [5m])) by (namespace, pod, container)
                / sum(rate({job="fluent-bit", container!=""} [5m])) by (namespace, pod, container) > 0.1
            for: 5m
            labels:
              severity: warning
              team: soc
            annotations:
              summary: "High error rate in {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}"
              description: "Error rate is above 10% for more than 5 minutes"

          - alert: ContainerCrashLooping
            expr: |
              rate(kube_pod_container_status_restarts_total{namespace!=""}[15m]) * 60 * 15 > 5
            for: 5m
            labels:
              severity: critical
              team: soc
            annotations:
              summary: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
              description: "Container has restarted {{ $value }} times in the last 15 minutes"

          - alert: HighMemoryUsage
            expr: |
              container_memory_usage_bytes{namespace!=""} / container_spec_memory_limit_bytes{namespace!=""} > 0.85
            for: 10m
            labels:
              severity: warning
              team: soc
            annotations:
              summary: "High memory usage in {{ $labels.namespace }}/{{ $labels.pod }}"
              description: "Memory usage is above 85% for more than 10 minutes"

          - alert: HighCPUUsage
            expr: |
              rate(container_cpu_usage_seconds_total{namespace!=""}[5m]) > 0.8
            for: 10m
            labels:
              severity: warning
              team: soc
            annotations:
              summary: "High CPU usage in {{ $labels.namespace }}/{{ $labels.pod }}"
              description: "CPU usage is above 80% for more than 10 minutes"

          - alert: PodNotReady
            expr: |
              kube_pod_status_ready{namespace!=""} == 0
            for: 15m
            labels:
              severity: critical
              team: soc
            annotations:
              summary: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is not ready"
              description: "Pod has been not ready for more than 15 minutes"

          - alert: SuspiciousNetworkActivity
            expr: |
              sum(rate(container_network_receive_bytes_total{namespace!=""}[5m])) by (namespace, pod) > 104857600
            for: 5m
            labels:
              severity: warning
              team: soc
            annotations:
              summary: "High network traffic in {{ $labels.namespace }}/{{ $labels.pod }}"
              description: "Network receive rate exceeds 100MB/s for more than 5 minutes"

          - alert: LokiIngestionRateHigh
            expr: |
              sum(rate(loki_distributor_bytes_received_total[5m])) > 10485760
            for: 5m
            labels:
              severity: warning
              team: soc
            annotations:
              summary: "Loki ingestion rate is high"
              description: "Loki is receiving more than 10MB/s of log data"

          - alert: ElasticsearchHeapHigh
            expr: |
              elasticsearch_jvm_memory_used_bytes{area="heap"} / elasticsearch_jvm_memory_max_bytes{area="heap"} > 0.85
            for: 10m
            labels:
              severity: critical
              team: soc
            annotations:
              summary: "Elasticsearch heap usage is high"
              description: "JVM heap usage is above 85% for more than 10 minutes"
---
# SOC Dashboard
apiVersion: v1
kind: ConfigMap
metadata:
  name: soc-dashboard
  namespace: soc
  labels:
    app: grafana
data:
  soc-overview.json: |
    {
      "dashboard": {
        "id": null,
        "title": "SOC Overview",
        "tags": ["soc", "security", "containers"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Log Volume by Namespace",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
            "datasource": {"type": "loki", "uid": "Loki"},
            "targets": [
              {
                "expr": "sum(rate({job=\"fluent-bit\"}[5m])) by (namespace)",
                "legendFormat": "{{namespace}}"
              }
            ]
          },
          {
            "id": 2,
            "title": "Error Rate by Container",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
            "datasource": {"type": "loki", "uid": "Loki"},
            "targets": [
              {
                "expr": "sum(rate({job=\"fluent-bit\", level=\"error\"}[5m])) by (container)",
                "legendFormat": "{{container}}"
              }
            ]
          },
          {
            "id": 3,
            "title": "Top Talkers (Network)",
            "type": "table",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
            "datasource": {"type": "elasticsearch", "uid": "Elasticsearch"},
            "targets": [
              {
                "query": "*",
                "metrics": [{"type": "count"}],
                "bucketAggs": [
                  {"type": "terms", "field": "namespace.keyword", "size": 10}
                ]
              }
            ]
          },
          {
            "id": 4,
            "title": "Pod Restarts",
            "type": "stat",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
            "datasource": {"type": "elasticsearch", "uid": "Elasticsearch"},
            "targets": [
              {
                "query": "event:restart",
                "metrics": [{"type": "count"}]
              }
            ]
          },
          {
            "id": 5,
            "title": "Log Levels Distribution",
            "type": "piechart",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
            "datasource": {"type": "loki", "uid": "Loki"},
            "targets": [
              {
                "expr": "sum by (level) (count_over_time({job=\"fluent-bit\"}[1h]))",
                "legendFormat": "{{level}}"
              }
            ]
          },
          {
            "id": 6,
            "title": "Active Alerts",
            "type": "table",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
            "datasource": {"type": "elasticsearch", "uid": "Elasticsearch"},
            "targets": [
              {
                "query": "alert:*",
                "metrics": [{"type": "count"}],
                "bucketAggs": [
                  {"type": "terms", "field": "alertname.keyword", "size": 20}
                ]
              }
            ]
          }
        ],
        "time": {"from": "now-6h", "to": "now"},
        "refresh": "30s"
      }
    }
