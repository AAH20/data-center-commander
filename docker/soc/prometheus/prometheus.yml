# =============================================================================
# Data Center Commander — Prometheus Configuration
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: data-center-commander
    environment: production

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alert_rules.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Node Exporter — host metrics
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # cAdvisor — container metrics
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # SOC Autoscaler — custom metrics
  - job_name: "autoscaler"
    static_configs:
      - targets: ["autoscaler:9102"]

  # SOC Scanner — scan results
  - job_name: "soc-scanner"
    static_configs:
      - targets: ["soc-scanner:9102"]
    scrape_interval: 300s

  # Falco — security events
  - job_name: "falco"
    static_configs:
      - targets: ["falco:9102"]
    scrape_interval: 30s
