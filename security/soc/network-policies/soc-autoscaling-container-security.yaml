        - protocol: TCP
          port: 53

---
# =============================================================================
# SOC COMPONENTS — Wazuh Manager
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-wazuh-manager-ingress
  namespace: soc
  labels:
    app.kubernetes.io/part-of: soc
    app.kubernetes.io/component: wazuh-manager
spec:
  podSelector:
    matchLabels:
      app: wazuh-manager
  policyTypes:
    - Ingress
  ingress:
    # Wazuh agents
    - from:
        - podSelector:
            matchLabels:
              app: wazuh-agent
      ports:
        - protocol: TCP
          port: 1514
        - protocol: TCP
          port: 1515
    # SOC Dashboard
    - from:
        - podSelector:
            matchLabels:
              app: soc-dashboard
      ports:
        - protocol: TCP
          port: 55000
    # Ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 55000
        - protocol: UDP
          port: 514
        - protocol: TCP
          port: 514

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-wazuh-manager-egress
  namespace: soc
  labels:
    app.kubernetes.io/part-of: soc
    app.kubernetes.io/component: wazuh-manager
spec:
  podSelector:
    matchLabels:
      app: wazuh-manager
  policyTypes:
    - Egress
  egress:
    # To Elasticsearch SOC
    - to:
        - podSelector:
            matchLabels:
              app: elasticsearch-soc
      ports:
        - protocol: TCP
          port: 9200
    # To Fluentd SOC
    - to:
        - podSelector:
            matchLabels:
              app: fluentd-soc
      ports:
        - protocol: TCP
          port: 24224
        - protocol: UDP
          port: 24224

