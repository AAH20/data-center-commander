# =============================================================================
# Network Policies — SOC + Auto Scaling + Container Security Integration
# Data Center Commander
# Version: 1.0.0
#
# This file provides network policies integrating:
#   - SOC (Security Operations Center) components
#   - Auto Scaling (HPA, VPA, Cluster Autoscaler)
#   - Container Security (Falco, OPA/Gatekeeper, Trivy)
#
# Namespaces covered: soc, kube-system (metrics-server), data-center-commander
# =============================================================================

---
# =============================================================================
# DEFAULT DENY — SOC namespace
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: soc-default-deny-ingress
  namespace: soc
  labels:
    app.kubernetes.io/part-of: soc
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
