# =============================================================================
# INGRESS CONTROLLER — Allow external traffic to SOC services
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-soc
  namespace: soc
  labels:
    app.kubernetes.io/part-of: soc
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # From ingress-nginx namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 1514
        - protocol: TCP
          port: 1515
        - protocol: TCP
          port: 55000
        - protocol: UDP
          port: 514
        - protocol: TCP
          port: 514
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
        - protocol: TCP
          port: 9200
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 9094
        - protocol: TCP
          port: 24224
        - protocol: UDP
          port: 24224
        - protocol: TCP
          port: 4954

