---
# =============================================================================
# AUTO SCALING — Metrics Server (kube-system)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-server-ingress
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: soc
    app.kubernetes.io/component: metrics-server
spec:
  podSelector:
    matchLabels:
      k8s-app: metrics-server
  policyTypes:
    - Ingress
  ingress:
    # HPA controller
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: horizontal-pod-autoscaler
      ports:
        - protocol: TCP
          port: 443
    # VPA controller
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vertical-pod-autoscaler
      ports:
        - protocol: TCP
          port: 443
    # Cluster autoscaler
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cluster-autoscaler
      ports:
        - protocol: TCP
          port: 443
    # SOC components (for custom metrics)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: soc
      ports:
        - protocol: TCP
          port: 443

