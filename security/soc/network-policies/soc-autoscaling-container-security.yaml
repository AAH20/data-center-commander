kind: NetworkPolicy
metadata:
  name: allow-gatekeeper-egress
  namespace: gatekeeper-system
  labels:
    app.kubernetes.io/part-of: soc
    app.kubernetes.io/component: gatekeeper
spec:
  podSelector:
    matchLabels:
      app: gatekeeper-controller-manager
  policyTypes:
    - Egress
  egress:
    # To kube-apiserver
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443

