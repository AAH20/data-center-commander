# OPA/Gatekeeper Policies — Data Center Commander SOC
# Version: 1.0.0

# =============================================================================
# POLICY: Require read-only root filesystem
# =============================================================================
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sReadOnlyRootFilesystem
metadata:
  name: readonly-rootfs
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces:
      - kube-system
      - kube-public
  parameters: {}

---
