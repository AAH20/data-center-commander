# POLICY: Require resource limits
# =============================================================================
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredResources
metadata:
  name: require-resources
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces:
      - kube-system
  parameters:
    limits:
      - cpu
      - memory
    requests:
      - cpu
      - memory

---
